# Keeps the pinned tooling current: GitHub Actions (pinned to commit SHAs
# with a version comment), the validation images (tag + @sha256 digest),
# the Go cross-check tools and the Python environment (uv.lock). Minor/patch
# updates are grouped into one PR per entry; major updates get their own PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # tests/e2e/images.Dockerfile: Nu Html Checker, Playwright and nginx
  # images of the `validate` CI job (the @playwright/test version follows
  # the Playwright image tag, see that file)
  - package-ecosystem: docker
    directory: /tests/e2e
    schedule:
      interval: weekly
    groups:
      docker-validate-minor-patch:
        update-types: [minor, patch]

  # tests/tools/go.mod: adifmt and adif-checker for the ADIF cross-checks
  - package-ecosystem: gomod
    directory: /tests/tools
    schedule:
      interval: weekly
    groups:
      go-crosscheck-minor-patch:
        update-types: [minor, patch]

  # tests/tools/images.Dockerfile: the golang image that builds them when
  # no local Go is installed
  - package-ecosystem: docker
    directory: /tests/tools
    schedule:
      interval: weekly
    groups:
      docker-go-minor-patch:
        update-types: [minor, patch]

  # pyproject.toml + uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
