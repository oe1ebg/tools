name: Weekly data rebuild

# The tools ship their data (callsigns, repeaters, locations, summits) built
# in: it is inlined into the offline bundles and part of the service-worker
# precache hash, so it can't be swapped separately. Once a week this
# rebuilds the newest release tag with fresh data and uploads
# oe1ebg-tools-<tag>.tar.gz (+ .sha256, SHA256SUMS) to the rolling
# prerelease `data-latest`, replacing last week's. manifest.json in the
# tarball has the build time. Sites that want fresh data (oe1ebg.at)
# download from there; anyone who wants a fixed state uses the release of
# the tag itself. As for a release, the tarball is published only after
# validate-dist.yml has checked it (HTML check and browser tests against
# the unpacked tarball under nginx).

on:
  schedule:
    - cron: '16 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Find the newest release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag=$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')
          if [ -z "$tag" ]; then echo "no release yet, nothing to rebuild" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout the release tag
        if: steps.tag.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Tag commit
        id: sha
        if: steps.tag.outputs.tag != ''
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        if: steps.tag.outputs.tag != ''
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Node.js
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up Go (ADIF cross-check tools)
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/tools/go.mod
          cache-dependency-path: tests/tools/go.sum

      - name: Build the ADIF cross-check tools (adifmt, adif-checker)
        if: steps.tag.outputs.tag != ''
        run: tests/tools/build.sh

      # The unit tests include plausibility checks of the fresh data
      # (callsign and repeater lists, location gold set): a broken upstream
      # export fails here instead of shipping; DATA_TESTS=require makes them
      # fail instead of skip without the data (tests/real-data.mjs, tags
      # from before it ignore the flag). ADIF_CROSSCHECK=require: the ADIF
      # cross-checks must run and pass too, as for a release.
      # GIT_SHA: the tag's commit (github.sha is the default branch's here);
      # BUILD_RUN_URL: this run, the ADIF editor's build provenance.
      - name: Build with fresh data
        if: steps.tag.outputs.tag != ''
        env:
          TOOLS_VERSION: ${{ steps.tag.outputs.tag }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ADIF_CROSSCHECK: require
          DATA_TESTS: require
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          uvx --from rust-just just dist
          uvx --from rust-just just test
          (cd dist && cat ./*.sha256 > SHA256SUMS)

      - name: Upload the tarball
        if: steps.tag.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  # Tests and nginx config of the tag the tarball was built from.
  validate:
    needs: rebuild
    if: needs.rebuild.outputs.tag != ''
    uses: ./.github/workflows/validate-dist.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.rebuild.outputs.sha }}

  publish:
    needs: [rebuild, validate]
    if: needs.rebuild.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # update the data-latest release
    steps:
      - name: Download the validated tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check the checksums
        run: cd dist && sha256sum -c SHA256SUMS

      # The asset names stay the same every week (sites download them by
      # name), and GitHub can't replace an asset in place: `upload --clobber`
      # deletes the old one first and leaves the name missing for the whole
      # upload. So each file is uploaded under a temporary name (.next)
      # first, and only then is the old asset deleted and the new one
      # renamed, two API calls per file. The name is still missing for that
      # moment (not zero), and a download in it can pair last week's tarball
      # with this week's checksum, which then fails the check rather than
      # passing a wrong file. Assets of an older version go last.
      - name: Upload to data-latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.rebuild.outputs.tag }}
          SHA: ${{ needs.rebuild.outputs.sha }}
        run: |
          set -euo pipefail
          if ! gh release view data-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create data-latest --repo "$REPO" --prerelease --latest=false \
              --target "$SHA" --title "Data rebuild of the newest release" \
              --notes "Weekly rebuild (data.yml) of the newest release with fresh data. Replaced every week."
          fi
          files=("oe1ebg-tools-$TAG.tar.gz" "oe1ebg-tools-$TAG.tar.gz.sha256" SHA256SUMS)
          mkdir -p next
          for f in "${files[@]}"; do cp "dist/$f" "next/$f.next"; done
          gh release upload data-latest --repo "$REPO" --clobber next/*.next
          asset_id() {
            gh api "repos/$REPO/releases/tags/data-latest" --jq ".assets[] | select(.name == \"$1\") | .id"
          }
          for f in "${files[@]}"; do
            new=$(asset_id "$f.next")
            old=$(asset_id "$f")
            if [ -n "$old" ]; then gh api -X DELETE "repos/$REPO/releases/assets/$old"; fi
            gh api -X PATCH "repos/$REPO/releases/assets/$new" -f name="$f" >/dev/null
          done
          # Last week's assets of other versions are stale now: keep only this one.
          gh release view data-latest --repo "$REPO" --json assets --jq '.assets[].name' |
            { grep -v -x -F -e "${files[0]}" -e "${files[1]}" -e "${files[2]}" || true; } |
            while read -r a; do gh release delete-asset data-latest "$a" --repo "$REPO" --yes; done
          echo "data-latest: oe1ebg-tools-$TAG.tar.gz rebuilt $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
