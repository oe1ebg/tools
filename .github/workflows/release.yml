name: Release

# On a version tag vX.Y.Z: run the unit tests, build the bundle with fresh
# data (no download cache) and publish dist/oe1ebg-tools-vX.Y.Z.tar.gz, its
# .sha256 and SHA256SUMS as the GitHub release of that tag. The release
# assets are immutable; data.yml rebuilds the newest release with fresh data
# every week into the rolling release `data-latest`.

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Build the release tarball
        env:
          GIT_SHA: ${{ github.sha }}
          TOOLS_VERSION: ${{ github.ref_name }}
        run: |
          uvx --from rust-just just dist
          uvx --from rust-just just test
          (cd dist && cat ./*.sha256 > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS --verify-tag --generate-notes --title "$TAG"
