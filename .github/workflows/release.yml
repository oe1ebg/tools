name: Release

# On a version tag vX.Y.Z: build the bundle with fresh data (no download
# cache) and run the unit tests (ADIF cross-checks and the real-data checks
# required), validate the exact tarball (validate-dist.yml: unpacked,
# served by nginx with deploy/nginx.conf.example, Nu Html Checker and
# Playwright in every browser project), and only then publish
# dist/oe1ebg-tools-vX.Y.Z.tar.gz, its .sha256 and SHA256SUMS as the GitHub
# release of that tag. The release assets are immutable; data.yml rebuilds
# the newest release with fresh data every week into the rolling release
# `data-latest`.

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require reviewed release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ ! -s "releases/$TAG.md" ]; then
            echo "::error::Missing release notes: releases/$TAG.md. Commit and review them before tagging."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up Go (ADIF cross-check tools)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/tools/go.mod
          cache-dependency-path: tests/tools/go.sum

      - name: Build the ADIF cross-check tools (adifmt, adif-checker)
        run: tests/tools/build.sh

      # ADIF_CROSSCHECK=require: the ADIF cross-checks against adifmt and
      # adif-checker must run and pass (they skip without the tools), or the
      # release is not published. DATA_TESTS=require: the same for the
      # checks of the fresh data (callsign and repeater lists, location gold
      # set, basemap; tests/real-data.mjs). BUILD_RUN_URL: this run, shown
      # as the build's provenance in the ADIF editor (scripts/build_adif.py).
      - name: Build the release tarball
        env:
          GIT_SHA: ${{ github.sha }}
          TOOLS_VERSION: ${{ github.ref_name }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ADIF_CROSSCHECK: require
          ADIF_XMLCHECK: require
          DATA_TESTS: require
        run: |
          uv sync --locked --group xml-tests
          uvx --from rust-just just dist
          uvx --from rust-just just test
          (cd dist && cat ./*.sha256 > SHA256SUMS)

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  validate:
    needs: build
    uses: ./.github/workflows/validate-dist.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  publish:
    needs: [build, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - name: Checkout release notes from the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the validated tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check the checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS --repo "$REPO" --verify-tag --generate-notes --notes-file "releases/$TAG.md" --title "$TAG"
