<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADIF Editor</title>
<style>
  :root{
    --bg: #ffffff;
    --bg-raised: #f5f5f5;
    --line: #0000000d;
    --text: #000000de;
    --text-dim: #00000099;
    --accent: #526cfe;
    --accent-dim: #6b78d0;
    --warn: #9a6700;
    --err: #c62828;
    --header-bg: rgba(255,255,255,.72);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: hsla(225,15%,5%,1);
      --bg-raised: hsla(225,20%,10%,1);
      --line: hsla(225,15%,90%,.12);
      --text: hsla(225,15%,90%,.82);
      --text-dim: hsla(225,15%,90%,.5);
      --accent: #526cfe;
      --accent-dim: #9aa8f5;
      --warn: #e0b35c;
      --err: #e0776b;
      --header-bg: rgba(12,13,15,.72);
    }
  }
  /* Explicit light/dark override (higher specificity than the bare :root
     rules above), set via the theme toggle + a data-theme attribute on
     <html>. No attribute at all = "auto", i.e. follows prefers-color-scheme.
     Every variable that has a light/dark-dependent value must be repeated
     here too — anything left out would keep following the OS preference
     (via the plain :root/media rules above) even when the user has
     explicitly forced the other mode, which is exactly the bug this
     block exists to avoid. */
  :root[data-theme="dark"]{
    --bg: hsla(225,15%,5%,1);
    --bg-raised: hsla(225,20%,10%,1);
    --line: hsla(225,15%,90%,.12);
    --text: hsla(225,15%,90%,.82);
    --text-dim: hsla(225,15%,90%,.5);
    --accent: #526cfe;
    --accent-dim: #9aa8f5;
    --warn: #e0b35c;
    --err: #e0776b;
    --header-bg: rgba(12,13,15,.72);
  }
  :root[data-theme="light"]{
    --bg: #ffffff;
    --bg-raised: #f5f5f5;
    --line: #0000000d;
    --text: #000000de;
    --text-dim: #00000099;
    --accent: #526cfe;
    --accent-dim: #6b78d0;
    --warn: #9a6700;
    --err: #c62828;
    --header-bg: rgba(255,255,255,.72);
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    font-size:13px;
    line-height:1.4;
    display:flex;
    flex-direction:column;
  }
  #site-header{
    display:flex;
    align-items:center;
    gap:.8em;
    padding:.5em .8em;
    position:sticky;
    top:0;
    z-index:20;
    background:var(--header-bg);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  #back-link{
    display:inline-flex;
    align-items:center;
    gap:.4em;
    color:var(--accent);
    text-decoration:none;
    font-size:12px;
  }
  #back-link:hover{ text-decoration:underline; }
  .icon-arrow-left{ width:1em; height:1em; }
  .badge{
    border:1px solid var(--line);
    border-radius:.4rem;
    padding:.15em .6em;
    color:var(--text-dim);
    font-size:11px;
    white-space:nowrap;
    text-decoration:none;
  }
  a.badge:hover{ color:var(--accent); border-color:var(--accent-dim); }
  #theme-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:.3rem;
    overflow:hidden;
  }
  #theme-toggle button{
    border:none;
    border-radius:0;
    padding:.3em .6em;
    font-size:11px;
    background:transparent;
    color:var(--text-dim);
  }
  #theme-toggle button:not(:first-child){ border-left:1px solid var(--line); }
  #theme-toggle button.active{
    background:var(--accent);
    color:#fff;
  }
  #toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:.6em 1.2em;
    padding:.6em .8em;
    background:var(--bg-raised);
    border-bottom:1px solid var(--line);
  }
  #toolbar h1{
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    margin:0;
    color:var(--text);
    white-space:nowrap;
  }
  #toolbar .sep{ color:var(--line); }
  button, .btn{
    font-family:var(--font-ui);
    font-size:12px;
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent-dim);
    padding:.35em .7em;
    cursor:pointer;
    border-radius:.2rem;
  }
  button:hover, .btn:hover{ background:rgba(82,108,254,0.1); }
  button:disabled{ color:var(--text-dim); border-color:var(--line); cursor:not-allowed; }
  button.danger{ color:var(--err); border-color:#5a3a33; }
  button.danger:hover{ background:rgba(217,112,90,0.1); }
  input[type=text], select{
    font-family:var(--font-ui);
    font-size:12px;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--line);
    padding:.35em .5em;
    border-radius:.2rem;
  }
  input[type=text]:focus, td[contenteditable]:focus{
    outline:1px solid var(--accent);
    outline-offset:-1px;
  }
  #stats{ color:var(--text-dim); white-space:nowrap; }
  #stats b{ color:var(--text); font-weight:600; }
  .spacer{ flex:1; }

  #tools-panel{
    display:none;
    align-items:center;
    gap:.6em;
    padding:.5em .8em;
    background:var(--bg-raised);
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  #tools-panel.show{ display:flex; flex-wrap:wrap; }
  #tools-panel input[type=text]{ width:16em; }
  #tools-panel .hint{ color:var(--text-dim); }

  #file-info{
    padding:.2em .8em;
    color:var(--text-dim);
    font-size:11px;
  }

  #warnings{
    display:none;
    padding:.5em .8em;
    background:#1c1811;
    border-bottom:1px solid #3a2f1a;
    color:var(--warn);
    font-size:12px;
    max-height:6em;
    overflow:auto;
  }
  #warnings.show{ display:block; }
  #warnings div{ padding:.1em 0; }

  #drop{
    flex:1;
    position:relative;
    overflow:auto;
    padding: 0 0 3em 0;
  }
  #drop.empty{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  #empty-msg{
    text-align:center;
    color:var(--text-dim);
    border:1px dashed var(--line);
    padding:3em 4em;
  }
  #empty-msg .hint{ color:var(--accent-dim); font-size:12px; margin-top:.6em; }
  #drop.dragover::after{
    content:"drop .adi / .adx file(s)";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(82,108,254,0.08);
    border:2px dashed var(--accent);
    color:var(--accent);
    font-size:14px;
    z-index:5;
    pointer-events:none;
  }

  table{
    border-collapse:collapse;
    width:max-content;
    min-width:100%;
    font-family:var(--font-mono);
  }
  thead th{
    position:sticky; top:0; z-index:2;
    background:var(--bg-raised);
    border-bottom:1px solid var(--accent-dim);
    border-right:1px solid var(--line);
    text-align:left;
    padding:.4em .6em;
    white-space:nowrap;
    font-weight:600;
    font-family:var(--font-ui);
    color:var(--accent);
  }
  thead th .colhead{
    display:flex; align-items:center; gap:.5em;
  }
  thead th .rmcol{
    color:var(--text-dim);
    cursor:pointer;
    font-weight:400;
  }
  thead th .rmcol:hover{ color:var(--err); }
  th.rownum-col, td.rownum{
    position:sticky; left:0; z-index:1;
    background:var(--bg-raised);
    color:var(--text-dim);
    text-align:right;
    padding:.4em .6em;
    border-right:1px solid var(--accent-dim);
    user-select:none;
    font-family:var(--font-ui);
  }
  td.rownum{ background:var(--bg); z-index:1; }
  td.rownum .del{ cursor:pointer; color:var(--text-dim); margin-left:.6em; }
  td.rownum .del:hover{ color:var(--err); }
  tbody td{
    border-bottom:1px solid var(--line);
    border-right:1px solid var(--line);
    padding:.35em .6em;
    white-space:pre;
    min-width:4em;
    max-width:28em;
    overflow-x:auto;
  }
  tbody tr:hover td{ background:rgba(82,108,254,0.04); }
  #addcol{
    display:flex; align-items:center; gap:.4em;
    padding:.3em .5em;
  }
  #addcol input{ width:10em; }
  #addrow-row td{
    padding:.5em .6em;
    color:var(--text-dim);
  }
  #addrow-row .btn{ display:inline-flex; }

  #filename-input{ width:14em; }
  a#dl{ display:none; }
</style>
</head>
<body>

<header id="site-header">
  <a id="back-link" href="../">
    <svg class="icon-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    back to site
  </a>
  <span class="spacer"></span>
  <div id="theme-toggle" role="group" aria-label="color theme">
    <button type="button" data-theme-choice="light" title="light theme">light</button>
    <button type="button" data-theme-choice="auto" title="match system theme">auto</button>
    <button type="button" data-theme-choice="dark" title="dark theme">dark</button>
  </div>
  <a class="badge" href="https://www.adif.org/317/ADIF_317.htm" target="_blank" rel="noopener">targets ADIF 3.1.7 ↗</a>
</header>

<div id="toolbar">
  <h1>ADIF EDITOR</h1>
  <span class="sep">/</span>
  <button id="btn-open">add file(s)…</button>
  <input id="file-input" type="file" accept=".adi,.adx,.txt" multiple style="display:none">
  <span id="stats"></span>
  <div class="spacer"></div>
  <input id="filename-input" type="text" value="export.adi" title="export filename">
  <button id="btn-export" disabled>export .adi</button>
  <button id="btn-export-csv" disabled>export .csv</button>
  <span class="sep">/</span>
  <select id="sota-mode" title="SOTA CSV mode">
    <option value="activator">activator</option>
    <option value="chaser">chaser</option>
  </select>
  <button id="btn-export-sota" disabled>export SOTA csv</button>
  <span class="sep">/</span>
  <button id="btn-toggle-tools">tools ▾</button>
</div>

<div id="tools-panel">
  <label for="tpl-input">fill blank COMMENT:</label>
  <input type="text" id="tpl-input" placeholder="{RST_SENT} {RST_RCVD} thx">
  <button id="btn-apply-tpl">apply</button>
  <span class="hint">only fills rows where COMMENT is currently empty — placeholders like {RST_SENT} pull from that record's field</span>
</div>

<div id="file-info"></div>

<div id="warnings"></div>

<div id="drop" class="empty">
  <div id="empty-msg">
    drag &amp; drop .adi / .adx file(s) here<br>
    <span class="hint">or click "add file(s)…" — files are added to the current log; nothing leaves the browser</span>
  </div>
</div>

<a id="dl" download></a>

<datalist id="adif-field-list"></datalist>

<script>
(function(){
  "use strict";

  /* ---------- ADIF field reference data (ADIF 3.1.7, QSO-record fields only) ----------
     Sourced from ADIF's own machine-readable export (adif.org.uk/317/resources,
     exports/csv/fields.csv), header-only fields (ADIF_VER, CREATED_TIMESTAMP,
     PROGRAMID, PROGRAMVERSION, USERDEFn) excluded since they aren't QSO columns. */
  const ADIF_FIELDS = [{"name":"ADDRESS","type":"MultilineString","desc":"the contacted station's complete mailing address: full name, street address, city, postal code, and country"},{"name":"ADDRESS_INTL","type":"IntlMultilineString","desc":"the contacted station's complete mailing address: full name, street address, city, postal code, and country"},{"name":"AGE","type":"Number","desc":"the contacted station's operator's age in years in the range 0 to 120 (inclusive)"},{"name":"ALTITUDE","type":"Number","desc":"the height of the contacted station in meters relative to Mean Sea Level (MSL). For example 1.5 km is <ALTITUDE:4>1500 and 10.5 m is <ALTITUDE:4>10.5"},{"name":"ANT_AZ","type":"Number","desc":"the logging station's antenna azimuth, in degrees with a value between 0 to 360 (inclusive). Values outside this range are import-only and must be normalized for export (e.g. 370 is exported as 10)..."},{"name":"ANT_EL","type":"Number","desc":"the logging station's antenna elevation, in degrees with a value between -90 to 90 (inclusive). Values outside this range are import-only and must be normalized for export (e.g. 100 is exported as..."},{"name":"ANT_PATH","type":"Enumeration","desc":"the signal path"},{"name":"ARRL_SECT","type":"Enumeration","desc":"the contacted station's ARRL section"},{"name":"AWARD_SUBMITTED","type":"SponsoredAwardList","desc":"the list of awards submitted to a sponsor. note that this field might not be used in a QSO record. It might be used to convey information about a user's \"Award Account\" between an award sponsor and..."},{"name":"AWARD_GRANTED","type":"SponsoredAwardList","desc":"the list of awards granted by a sponsor. note that this field might not be used in a QSO record. It might be used to convey information about a user's \"Award Account\" between an award sponsor and t..."},{"name":"A_INDEX","type":"Number","desc":"the geomagnetic A index at the time of the QSO in the range 0 to 400 (inclusive)"},{"name":"BAND","type":"Enumeration","desc":"QSO Band","common":true},{"name":"BAND_RX","type":"Enumeration","desc":"in a split frequency QSO, the logging station's receiving band"},{"name":"CALL","type":"String","desc":"the contacted station's callsign","common":true},{"name":"CHECK","type":"String","desc":"contest check (e.g. for ARRL Sweepstakes)"},{"name":"CLASS","type":"String","desc":"contest class (e.g. for ARRL Field Day)"},{"name":"CLUBLOG_QSO_UPLOAD_DATE","type":"Date","desc":"the date the QSO was last uploaded to the Club Log online service"},{"name":"CLUBLOG_QSO_UPLOAD_STATUS","type":"Enumeration","desc":"the upload status of the QSO on the Club Log online service"},{"name":"CNTY","type":"Enumeration","desc":"the contacted station's Secondary Administrative Subdivision (e.g. US county, JA Gun), in the specified format","common":true},{"name":"CNTY_ALT","type":"SecondaryAdministrativeSubdivisionListAlt","desc":"a semicolon (;) delimited, unordered list of Secondary Administrative Subdivision Alt codes for the contacted station See the Data Type for details."},{"name":"COMMENT","type":"String","desc":"comment field for QSO for a message to be incorporated in a paper or electronic QSL for the contacted station's operator, use the QSLMSG field recommended use: information of interest to the contac...","common":true},{"name":"COMMENT_INTL","type":"IntlString","desc":"comment field for QSO for a message to be incorporated in a paper or electronic QSL for the contacted station's operator, use the QSLMSG_INTL field recommended use: information of interest to the c..."},{"name":"CONT","type":"Enumeration","desc":"the contacted station's Continent","common":true},{"name":"CONTACTED_OP","type":"String","desc":"the callsign of the individual operating the contacted station"},{"name":"CONTEST_ID","type":"String","desc":"QSO Contest Identifier use enumeration values for interoperability","common":true},{"name":"COUNTRY","type":"String","desc":"the contacted station's DXCC entity name","common":true},{"name":"COUNTRY_INTL","type":"IntlString","desc":"the contacted station's DXCC entity name"},{"name":"CQZ","type":"PositiveInteger","desc":"the contacted station's CQ Zone in the range 1 to 40 (inclusive)","common":true},{"name":"CREDIT_SUBMITTED","type":"CreditList,AwardList","desc":"the list of credits sought for this QSO Use of data type AwardList and enumeration Award are import-only"},{"name":"CREDIT_GRANTED","type":"CreditList,AwardList","desc":"the list of credits granted to this QSO Use of data type AwardList and enumeration Award are import-only"},{"name":"DARC_DOK","type":"Enumeration","desc":"the contacted station's DARC DOK (District Location Code) A DOK comprises letters and numbers, e.g. <DARC_DOK:3>A01 Note that DARC provides two different lists - one for DOKs and one for Special DOKs."},{"name":"DCL_QSLRDATE","type":"Date","desc":"date QSL received from DCL (only valid if DCL_QSL_RCVD is Y, I, or V)(V import-only)"},{"name":"DCL_QSLSDATE","type":"Date","desc":"date QSL sent to DCL (only valid if DCL_QSL_SENT is Y, Q, or I)"},{"name":"DCL_QSL_RCVD","type":"Enumeration","desc":"DCL QSL received status Default Value: N"},{"name":"DCL_QSL_SENT","type":"Enumeration","desc":"DCL QSL sent status Default Value: N"},{"name":"DISTANCE","type":"Number","desc":"the distance between the logging station and the contacted station in kilometers via the specified signal path with a value greater than or equal to 0"},{"name":"DXCC","type":"Enumeration","desc":"the contacted station's DXCC Entity Code <DXCC:1>0 means that the contacted station is known not to be within a DXCC entity.","common":true},{"name":"EMAIL","type":"String","desc":"the contacted station's email address"},{"name":"EQ_CALL","type":"String","desc":"the contacted station's owner's callsign"},{"name":"EQSL_AG","type":"Enumeration","desc":"indicates whether the QSO is known to be \"Authenticity Guaranteed\" by eQSL Default value: U"},{"name":"EQSL_QSLRDATE","type":"Date","desc":"date QSL received from eQSL.cc (only valid if EQSL_QSL_RCVD is Y, I, or V)(V import-only)"},{"name":"EQSL_QSLSDATE","type":"Date","desc":"date QSL sent to eQSL.cc (only valid if EQSL_QSL_SENT is Y, Q, or I)"},{"name":"EQSL_QSL_RCVD","type":"Enumeration","desc":"eQSL.cc QSL received status instead of V (import-only) use <CREDIT_GRANTED:42>CQWAZ:eqsl,CQWAZ_BAND:eqsl,CQWAZ_MODE:eqsl Default Value: N","common":true},{"name":"EQSL_QSL_SENT","type":"Enumeration","desc":"eQSL.cc QSL sent status Default Value: N"},{"name":"FISTS","type":"PositiveInteger","desc":"the contacted station's FISTS CW Club member number with a value greater than 0."},{"name":"FISTS_CC","type":"PositiveInteger","desc":"the contacted station's FISTS CW Club Century Certificate (CC) number with a value greater than 0."},{"name":"FORCE_INIT","type":"Boolean","desc":"new EME \"initial\""},{"name":"FREQ","type":"Number","desc":"QSO frequency in Megahertz","common":true},{"name":"FREQ_RX","type":"Number","desc":"in a split frequency QSO, the logging station's receiving frequency in Megahertz"},{"name":"GRIDSQUARE","type":"GridSquare","desc":"the contacted station's 2-character, 4-character, 6-character, or 8-character Maidenhead Grid Square For 10 or 12 character locators, store the first 8 characters in GRIDSQUARE and the additional 2...","common":true},{"name":"GRIDSQUARE_EXT","type":"GridSquareExt","desc":"for a contacted station's 10-character Maidenhead locator, supplements the GRIDSQUARE field by containing characters 9 and 10. For a contacted station's 12-character Maidenhead locator, supplements..."},{"name":"GUEST_OP","type":"String","desc":"import-only: use OPERATOR instead"},{"name":"HAMLOGEU_QSO_UPLOAD_DATE","type":"Date","desc":"the date the QSO was last uploaded to the HAMLOG.EU online service"},{"name":"HAMLOGEU_QSO_UPLOAD_STATUS","type":"Enumeration","desc":"the upload status of the QSO on the HAMLOG.EU online service"},{"name":"HAMQTH_QSO_UPLOAD_DATE","type":"Date","desc":"the date the QSO was last uploaded to the HamQTH.com online service"},{"name":"HAMQTH_QSO_UPLOAD_STATUS","type":"Enumeration","desc":"the upload status of the QSO on the HamQTH.com online service"},{"name":"HRDLOG_QSO_UPLOAD_DATE","type":"Date","desc":"the date the QSO was last uploaded to the HRDLog.net online service"},{"name":"HRDLOG_QSO_UPLOAD_STATUS","type":"Enumeration","desc":"the upload status of the QSO on the HRDLog.net online service"},{"name":"IOTA","type":"IOTARefNo","desc":"the contacted station's IOTA designator, in format CC-XXX, where CC is a member of the Continent enumeration XXX is the island group designator, where 1 <= XXX <= 999 [use leading zeroes]","common":true},{"name":"IOTA_ISLAND_ID","type":"PositiveInteger","desc":"the contacted station's IOTA Island Identifier, an 8-digit integer in the range 1 to 99999999 [leading zeroes optional]"},{"name":"ITUZ","type":"PositiveInteger","desc":"the contacted station's ITU zone in the range 1 to 90 (inclusive)","common":true},{"name":"K_INDEX","type":"Integer","desc":"the geomagnetic K index at the time of the QSO in the range 0 to 9 (inclusive)"},{"name":"LAT","type":"Location","desc":"the contacted station's latitude"},{"name":"LON","type":"Location","desc":"the contacted station's longitude"},{"name":"LOTW_QSLRDATE","type":"Date","desc":"date QSL received from ARRL Logbook of the World (only valid if LOTW_QSL_RCVD is Y, I, or V)(V import-only)"},{"name":"LOTW_QSLSDATE","type":"Date","desc":"date QSL sent to ARRL Logbook of the World (only valid if LOTW_QSL_SENT is Y, Q, or I)"},{"name":"LOTW_QSL_RCVD","type":"Enumeration","desc":"ARRL Logbook of the World QSL received status instead of V (import-only) use <CREDIT_GRANTED:39>DXCC:lotw,DXCC_BAND:lotw,DXCC_MODE:lotw Default Value: N","common":true},{"name":"LOTW_QSL_SENT","type":"Enumeration","desc":"ARRL Logbook of the World QSL sent status Default Value: N"},{"name":"MAX_BURSTS","type":"Number","desc":"maximum length of meteor scatter bursts heard by the logging station, in seconds with a value greater than or equal to 0"},{"name":"MODE","type":"Enumeration","desc":"QSO Mode","common":true},{"name":"MORSE_KEY_INFO","type":"String","desc":"details of the contacted station's Morse key (e.g. make, model, etc). Example: <MORSE_KEY_INFO:16>Begali Sculpture"},{"name":"MORSE_KEY_TYPE","type":"Enumeration","desc":"the contacted station's Morse key type (e.g. straight key, bug, etc). Example for a dual-lever paddle: <MORSE_KEY_TYPE:2>DP"},{"name":"MS_SHOWER","type":"String","desc":"For Meteor Scatter QSOs, the name of the meteor shower in progress"},{"name":"MY_ALTITUDE","type":"Number","desc":"the height of the logging station in meters relative to Mean Sea Level (MSL). For example 1.5 km is <MY_ALTITUDE:4>1500 and 10.5 m is <MY_ALTITUDE:4>10.5"},{"name":"MY_ANTENNA","type":"String","desc":"the logging station's antenna"},{"name":"MY_ANTENNA_INTL","type":"IntlString","desc":"the logging station's antenna"},{"name":"MY_ARRL_SECT","type":"Enumeration","desc":"the logging station's ARRL section"},{"name":"MY_CITY","type":"String","desc":"the logging station's city"},{"name":"MY_CITY_INTL","type":"IntlString","desc":"the logging station's city"},{"name":"MY_CNTY","type":"Enumeration","desc":"the logging station's Secondary Administrative Subdivision (e.g. US county, JA Gun), in the specified format"},{"name":"MY_CNTY_ALT","type":"SecondaryAdministrativeSubdivisionListAlt","desc":"a semicolon (;) delimited, unordered list of Secondary Administrative Subdivision Alt codes for the logging station See the Data Type for details."},{"name":"MY_COUNTRY","type":"String","desc":"the logging station's DXCC entity name"},{"name":"MY_COUNTRY_INTL","type":"IntlString","desc":"the logging station's DXCC entity name"},{"name":"MY_CQ_ZONE","type":"PositiveInteger","desc":"the logging station's CQ Zone in the range 1 to 40 (inclusive)"},{"name":"MY_DARC_DOK","type":"Enumeration","desc":"the logging station's DARC DOK (District Location Code) A DOK comprises letters and n ":"SIG_INFO","type":"String","desc":"information associated with the contacted station's activity or interest group"},{"name":"SIG_INFO_INTL","type":"IntlString","desc":"information associated with the contacted station's activity or interest group"},{"name":"SILENT_KEY","type":"Boolean","desc":"'Y' indicates that the contacted station's operator is now a Silent Key."},{"name":"SKCC","type":"String","desc":"the contacted station's Straight Key Century Club (SKCC) member information"},{"name":"SOTA_REF","type":"SOTARef","desc":"the contacted station's International SOTA Reference.","common":true},{"name":"SRX","type":"Integer","desc":"contest QSO received serial number with a value greater than or equal to 0","common":true},{"name":"SRX_STRING","type":"String","desc":"contest QSO received information use Cabrillo format to convey contest information for which ADIF fields are not specified in the event of a conflict between information in a dedicated contest fiel..."},{"name":"STATE","type":"Enumeration","desc":"the code for the contacted station's Primary Administrative Subdivision (e.g. US State, JA Island, VE Province)","common":true},{"name":"STATION_CALLSIGN","type":"String","desc":"the logging station's callsign (the callsign used over the air) if STATION_CALLSIGN is absent, OPERATOR shall be treated as both the logging station's callsign and the logging operator's callsign","common":true},{"name":"STX","type":"Integer","desc":"contest QSO transmitted serial number with a value greater than or equal to 0","common":true},{"name":"STX_STRING","type":"String","desc":"contest QSO transmitted information use Cabrillo format to convey contest information for which ADIF fields are not specified in the event of a conflict between information in a dedicated contest f..."},{"name":"SUBMODE","type":"String","desc":"QSO Submode use enumeration values for interoperability","common":true},{"name":"SWL","type":"Boolean","desc":"indicates that the QSO information pertains to an   const ADIF_FIELD_MAP = new Map(ADIF_FIELDS.map(f => [f.name, f]));

  function populateFieldDatalist(){
    const dl = document.getElementById('adif-field-list');
    // Commonly-used fields first, and visibly marked — the <option>'s `value`
    // (what actually fills the input on selection) stays the plain field name;
    // only the displayed label carries the "★ commonly used" marking.
    const ordered = [...ADIF_FIELDS].sort((a, b) => (b.common ? 1 : 0) - (a.common ? 1 : 0));
    for (const f of ordered){
      const opt = document.createElement('option');
      opt.value = f.name;
      if (f.common) opt.textContent = `★ ${f.name} — commonly used`;
      dl.appendChild(opt);
    }
  }

  /* ---------- ADIF parse / serialize ---------- */

  function parseADIF(text, warnings, sourceLabel, headerInfo){
    const tagRe = /<([A-Za-z0-9_]+)(?::(\d+)(?::[A-Za-z]+)?)?>/g;
    let bodyStart = 0;
    const firstNonWs = text.match(/\S/);
    if (!firstNonWs || firstNonWs[0] !== '<' || !/^\s*<[A-Za-z]+:\d/.test(text)) {
      // Likely has a free-text header; look for <EOH>
      const eoh = /<eoh>/i.exec(text);
      if (eoh) {
        bodyStart = eoh.index + eoh[0].length;
      } else if (firstNonWs && firstNonWs[0] !== '<') {
        warnings.push(`${sourceLabel}: no <EOH> tag found; parsing entire file as records.`);
      }
    }
    if (headerInfo && bodyStart > 0) {
      // Header fields (e.g. <ADIF_VER:5>3.1.7) live before <EOH> and use the same
      // tag syntax as body fields, so scan just that slice with its own loop —
      // only when a real <EOH> was found, never as a fallback over body text.
      const headerText = text.slice(0, bodyStart);
      const hRe = /<([A-Za-z0-9_]+)(?::(\d+)(?::[A-Za-z]+)?)?>/g;
      let hm;
      while ((hm = hRe.exec(headerText)) !== null) {
        const hname = hm[1].toUpperCase();
        if (hname === 'EOH' || hm[2] === undefined) continue;
        const hlen = parseInt(hm[2], 10);
        const hval = headerText.substr(hRe.lastIndex, hlen);
        if (hname === 'ADIF_VER' || hname === 'PROGRAMID' || hname === 'PROGRAMVERSION') {
          headerInfo[hname] = hval;
        }
        hRe.lastIndex += hlen;
      }
    }
    const body = text.slice(bodyStart);
    const records = [];
    let current = {};
    let any = false;
    tagRe.lastIndex = 0;
    let m;
    while ((m = tagRe.exec(body)) !== null) {
      const name = m[1].toUpperCase();
      const lenStr = m[2];
      const tagEnd = tagRe.lastIndex;
      if (name === 'EOR') {
        records.push(current);
        current = {};
        any = false;
        continue;
      }
      if (name === 'EOH') continue;
      if (lenStr === undefined) {
        warnings.push(`${sourceLabel}: field <${name}> has no length, skipped.`);
        continue;
      }
      const len = parseInt(lenStr, 10);
      const value = body.substr(tagEnd, len);
      current[name] = value;
      any = true;
      tagRe.lastIndex = tagEnd + len;
    }
    if (any) {
      warnings.push(`${sourceLabel}: trailing fields after last <EOR>, appended as final record.`);
      records.push(current);
    }
    return records;
  }

  function serializeADIF(records, columns){
    let out = "Generated by ADIF Editor (client-side, no server round-trip)\n";
    out += "<PROGRAMID:10>ADIFEditor\n<ADIF_VER:5>3.1.7\n<EOH>\n\n";
    for (const rec of records){
      let line = "";
      for (const col of columns){
        const val = rec[col];
        if (val === undefined || val === "") continue;
        line += `<${col}:${val.length}>${val} `;
      }
      line += "<EOR>\n";
      out += line;
    }
    return out;
  }

  function csvEscapeRFC4180(val){
    const s = (val === undefined || val === null) ? '' : String(val);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function serializeCSV(records, columns){
    // Unlike serializeADIF, every column must be emitted positionally (including
    // blank cells) or rows would misalign — don't reuse the ADIF skip-empty loop.
    const lines = [columns.map(csvEscapeRFC4180).join(',')];
    for (const rec of records){
      lines.push(columns.map(c => csvEscapeRFC4180(rec[c] ?? '')).join(','));
    }
    return lines.join('\r\n');
  }

  /* SOTA database V2 CSV format, verified against sotadata.org.uk's own
     ActivatorCSVInfo.htm and a working converter's source (not just blog posts):
     V2,<My Callsign>,<My Summit>,<Date DD/MM/YYYY>,<Time HHMM>,<Band>,<Mode>,
     <His Callsign>,<His Summit>,<Notes/Comments> */

  function sotaSanitizeField(val){
    // SOTA's CSV importer has no quoting support: commas must not appear in any
    // field. Deliberately NOT sharing csvEscapeRFC4180 with this exporter.
    return (val || '').replace(/,/g, ';');
  }

  function sotaDate(qsoDate){
    return /^\d{8}$/.test(qsoDate || '') ? `${qsoDate.slice(6,8)}/${qsoDate.slice(4,6)}/${qsoDate.slice(0,4)}` : '';
  }

  function sotaTime(timeOn){
    const t = timeOn || '';
    return t.length >= 4 ? t.slice(0,4) : '';
  }

  function sotaRow(rec){
    const myCall = rec.STATION_CALLSIGN || rec.OPERATOR || '';
    return [
      'V2', myCall, rec.MY_SOTA_REF || '', sotaDate(rec.QSO_DATE), sotaTime(rec.TIME_ON),
      rec.BAND || '', rec.MODE || '', rec.CALL || '', rec.SOTA_REF || '',
      rec.COMMENT || rec.NOTES || ''
    ].map(sotaSanitizeField).join(',');
  }

  function serializeSotaCsv(records, mode){
    const field = mode === 'chaser' ? 'SOTA_REF' : 'MY_SOTA_REF';
    const filtered = records.filter(r => (r[field] || '').trim() !== '');
    // SOTA requires chronological order; sort only this exported copy, never
    // the main table's row order.
    filtered.sort((a, b) => (a.QSO_DATE + a.TIME_ON).localeCompare(b.QSO_DATE + b.TIME_ON));
    return filtered.length ? filtered.map(sotaRow).join('\r\n') + '\r\n' : '';
  }

  /* ---------- state ---------- */

  let records = [];   // array of {FIELD: value}
  let columns = [];   // ordered field names
  let fileMeta = [];  // [{name, adifVer, programId, programVersion}], one per loaded file

  function rebuildColumns(){
    const seen = new Set(columns);
    for (const rec of records){
      for (const k of Object.keys(rec)){
        if (!seen.has(k)){ seen.add(k); columns.push(k); }
      }
    }
  }

  function addWarning(msg){
    const box = document.getElementById('warnings');
    const div = document.createElement('div');
    div.textContent = '⚠ ' + msg;
    box.appendChild(div);
    box.classList.add('show');
  }

  function clearWarnings(){
    const box = document.getElementById('warnings');
    box.innerHTML = '';
    box.classList.remove('show');
  }

  /* ---------- rendering ---------- */

  const dropEl = document.getElementById('drop');

  function setExportButtonsDisabled(disabled){
    document.getElementById('btn-export').disabled = disabled;
    document.getElementById('btn-export-csv').disabled = disabled;
    document.getElementById('btn-export-sota').disabled = disabled;
  }

  function render(){
    dropEl.classList.remove('empty');
    if (records.length === 0){
      dropEl.classList.add('empty');
      dropEl.innerHTML = '<div id="empty-msg">drag &amp; drop .adi / .adx file(s) here<br>' +
        '<span class="hint">or click "add file(s)…" — files are added to the current log; nothing leaves the browser</span></div>';
      updateStats();
      updateFileInfo();
      setExportButtonsDisabled(true);
      return;
    }
    setExportButtonsDisabled(false);

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const htr = document.createElement('tr');
    const rowNumTh = document.createElement('th');
    rowNumTh.className = 'rownum-col';
    rowNumTh.textContent = '#';
    htr.appendChild(rowNumTh);
    columns.forEach((col, ci) => {
      const th = document.createElement('th');
      const wrap = document.createElement('span');
      wrap.className = 'colhead';
      const label = document.createElement('span');
      label.textContent = col;
      label.style.cursor = 'pointer';
      const fieldDef = ADIF_FIELD_MAP.get(col);
      label.title = 'click to sort' + (fieldDef
        ? ` — ${fieldDef.type}: ${fieldDef.desc}`
        : ' — no ADIF definition (custom/application field)');
      label.addEventListener('click', () => sortByColumn(col));
      const rm = document.createElement('span');
      rm.className = 'rmcol';
      rm.textContent = '×';
      rm.title = 'remove column';
      rm.addEventListener('click', (e) => { e.stopPropagation(); removeColumn(col); });
      wrap.appendChild(label);
      wrap.appendChild(rm);
      th.appendChild(wrap);
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    records.forEach((rec, ri) => {
      const tr = document.createElement('tr');
      const numTd = document.createElement('td');
      numTd.className = 'rownum';
      numTd.innerHTML = (ri+1) + '<span class="del" title="delete row">×</span>';
      numTd.querySelector('.del').addEventListener('click', () => deleteRow(ri));
      tr.appendChild(numTd);
      columns.forEach(col => {
        const td = document.createElement('td');
        td.contentEditable = 'true';
        td.spellcheck = false;
        td.textContent = rec[col] !== undefined ? rec[col] : '';
        td.addEventListener('blur', () => {
          const v = td.textContent;
          if (v === '') delete rec[col];
          else rec[col] = v;
          updateStats();
        });
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    dropEl.innerHTML = '';
    dropEl.appendChild(table);

    const addRowDiv = document.createElement('div');
    addRowDiv.style.padding = '.6em .8em';
    const addRowBtn = document.createElement('button');
    addRowBtn.textContent = '+ row';
    addRowBtn.addEventListener('click', addRow);
    addRowDiv.appendChild(addRowBtn);

    const newFieldInput = document.createElement('input');
    newFieldInput.type = 'text';
    newFieldInput.setAttribute('list', 'adif-field-list');
    newFieldInput.placeholder = 'field name…';
    newFieldInput.style.marginLeft = '.6em';
    newFieldInput.style.width = '14em';
    addRowDiv.appendChild(newFieldInput);

    const addColBtn = document.createElement('button');
    addColBtn.textContent = '+ field';
    addColBtn.style.marginLeft = '.4em';
    addColBtn.addEventListener('click', () => {
      const name = newFieldInput.value.trim().toUpperCase();
      if (name) addColumn(name);
      newFieldInput.value = '';
    });
    newFieldInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addColBtn.click();
    });
    addRowDiv.appendChild(addColBtn);

    dropEl.appendChild(addRowDiv);

    updateStats();
    updateFileInfo();
  }

  function updateStats(){
    const stats = document.getElementById('stats');
    if (records.length === 0){ stats.textContent = ''; return; }
    const bands = new Set(records.map(r => r.BAND).filter(Boolean));
    const modes = new Set(records.map(r => r.MODE).filter(Boolean));
    stats.innerHTML = `<b>${records.length}</b> QSOs` +
      (fileMeta.length > 1 ? ` from <b>${fileMeta.length}</b> files` : '') +
      ` · <b>${columns.length}</b> fields` +
      (bands.size ? ` · bands: ${[...bands].join(', ')}` : '') +
      (modes.size ? ` · modes: ${[...modes].join(', ')}` : '');
  }

  function updateFileInfo(){
    const el = document.getElementById('file-info');
    if (!fileMeta.length){ el.textContent = ''; return; }
    el.textContent = fileMeta.map(f => `${f.name}: ADIF ${f.adifVer || 'version not declared'}`).join(' · ');
  }

  /* ---------- editing ops ---------- */

  function addRow(){
    records.push({});
    render();
  }

  function deleteRow(idx){
    records.splice(idx, 1);
    render();
  }

  function addColumn(name){
    if (!name || columns.includes(name)) return;
    columns.push(name);
    render();
  }

  function removeColumn(name){
    columns = columns.filter(c => c !== name);
    for (const rec of records) delete rec[name];
    render();
  }

  let sortState = { col: null, asc: true };
  function sortByColumn(col){
    if (sortState.col === col) sortState.asc = !sortState.asc;
    else { sortState = { col, asc: true }; }
    records.sort((a, b) => {
      const av = a[col] ?? '';
      const bv = b[col] ?? '';
      const an = parseFloat(av), bn = parseFloat(bv);
      let cmp;
      if (!isNaN(an) && !isNaN(bn) && String(an) === av.trim() && String(bn) === bv.trim()){
        cmp = an - bn;
      } else {
        cmp = av.localeCompare(bv);
      }
      return sortState.asc ? cmp : -cmp;
    });
    render();
  }

  function applyCommentTemplate(template){
    const re = /\{([A-Za-z0-9_]+)\}/g;
    let changed = false;
    for (const rec of records){
      if (rec.COMMENT) continue; // only fill rows where COMMENT is currently blank/absent
      const filled = template.replace(re, (_, name) => rec[name.toUpperCase()] || '');
      if (filled !== ''){ rec.COMMENT = filled; changed = true; }
    }
    if (changed){ rebuildColumns(); render(); }
  }

  /* ---------- file loading ---------- */

  function loadFiles(fileList){
    clearWarnings();
    const files = Array.from(fileList);
    let pending = files.length;
    if (!pending) return;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        const warnings = [];
        const headerInfo = {};
        const parsed = parseADIF(reader.result, warnings, file.name, headerInfo);
        records = records.concat(parsed);
        rebuildColumns();
        fileMeta.push({
          name: file.name,
          adifVer: headerInfo.ADIF_VER || null,
          programId: headerInfo.PROGRAMID || null,
          programVersion: headerInfo.PROGRAMVERSION || null,
        });
        warnings.forEach(addWarning);
        pending--;
        if (pending === 0) render();
      };
      reader.onerror = () => {
        addWarning(`${file.name}: could not be read.`);
        pending--;
        if (pending === 0) render();
      };
      reader.readAsText(file);
    });
    const fnInput = document.getElementById('filename-input');
    if (files.length === 1) fnInput.value = files[0].name.replace(/\.[^.]+$/, '') + '.adi';
  }

  /* ---------- drag & drop / open / export wiring ---------- */

  ['dragenter','dragover'].forEach(evt =>
    dropEl.addEventListener(evt, e => { e.preventDefault(); dropEl.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(evt =>
    dropEl.addEventListener(evt, e => { e.preventDefault(); dropEl.classList.remove('dragover'); }));
  dropEl.addEventListener('drop', e => {
    if (e.dataTransfer.files && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
  });

  document.getElementById('btn-open').addEventListener('click', () => {
    document.getElementById('file-input').click();
  });
  document.getElementById('file-input').addEventListener('change', e => {
    if (e.target.files.length) loadFiles(e.target.files);
    e.target.value = '';
  });

  function downloadText(text, mime, filename){
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.getElementById('dl');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function swapExt(filename, ext){
    const base = (filename || 'export').replace(/\.[^.]+$/, '');
    return `${base}.${ext}`;
  }

  document.getElementById('btn-export').addEventListener('click', () => {
    const name = document.getElementById('filename-input').value.trim() || 'export.adi';
    downloadText(serializeADIF(records, columns), 'text/plain', name);
  });

  document.getElementById('btn-export-csv').addEventListener('click', () => {
    const name = swapExt(document.getElementById('filename-input').value, 'csv');
    downloadText(serializeCSV(records, columns), 'text/csv', name);
  });

  document.getElementById('btn-export-sota').addEventListener('click', () => {
    const mode = document.getElementById('sota-mode').value;
    downloadText(serializeSotaCsv(records, mode), 'text/csv', `sota-${mode}.csv`);
  });

  document.getElementById('btn-toggle-tools').addEventListener('click', () => {
    document.getElementById('tools-panel').classList.toggle('show');
  });

  document.getElementById('btn-apply-tpl').addEventListener('click', () => {
    applyCommentTemplate(document.getElementById('tpl-input').value);
  });

  /* ---------- theme (light / dark / auto) ---------- */

  const THEME_KEY = 'adif-editor-theme';

  function applyTheme(mode){
    if (mode === 'light' || mode === 'dark') {
      document.documentElement.setAttribute('data-theme', mode);
    } else {
      document.documentElement.removeAttribute('data-theme'); // "auto": follow prefers-color-scheme
    }
    document.querySelectorAll('#theme-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.themeChoice === mode);
    });
  }

  function initTheme(){
    applyTheme(localStorage.getItem(THEME_KEY) || 'auto');
    document.querySelectorAll('#theme-toggle button').forEach(b => {
      b.addEventListener('click', () => {
        const mode = b.dataset.themeChoice;
        localStorage.setItem(THEME_KEY, mode);
        applyTheme(mode);
      });
    });
  }

  initTheme();
  populateFieldDatalist();
  render();
})();
</script>
</body>
</html>
