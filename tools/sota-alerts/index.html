      const pinned = state.candidates.has(cand.key);
      const isRef = cand.key === state.referenceKey;
      const altPts = summitMetaLine(cand);
      const alertBrief = formatAlertsBrief(alertsForSummitInRange(cand.key));
      return `<div class="search-result">` +
        `<div class="search-result-top">` +
        `<span>${escapeHtml(cand.name)} <span class="li-summit">${escapeHtml(cand.key)}</span>${altPts ? ` · ${escapeHtml(altPts)}` : ''}</span>` +
        `<span class="search-result-actions">` +
        `<button type="button" class="btn-ref" data-setref-cand-key="${escapeHtml(cand.key)}" ${isRef ? 'disabled' : ''}>${isRef ? 'reference ✓' : 'set as reference'}</button>` +
        `<button type="button" class="btn-ref" data-pin-cand-key="${escapeHtml(cand.key)}" ${pinned ? 'disabled' : ''}>${pinned ? 'pinned ✓' : '+ pin'}</button>` +
        `</span>` +
        `</div>` +
        (alertBrief ? `<div class="search-result-alert">alert: ${escapeHtml(alertBrief)}</div>` : '') +
        `</div>`;
    }).join('');
    panel.querySelectorAll('[data-pin-cand-key]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cand = cands.find(c => c.key === btn.dataset.pinCandKey);
        if (cand) pinCandidate(cand);
        btn.textContent = 'pinned ✓';
        btn.disabled = true;
      });
    });
    panel.querySelectorAll('[data-setref-cand-key]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cand = cands.find(c => c.key === btn.dataset.setrefCandKey);
        if (!cand) return;
        pinCandidate(cand, { asReference: true });
        // Refresh every reference button in this panel, not just the one
        // clicked — setting a new reference un-sets whichever summit was
        // previously the reference, which might also be listed here.
        panel.querySelectorAll('[data-setref-cand-key]').forEach(b => {
          const isNowRef = b.dataset.setrefCandKey === state.referenceKey;
          b.disabled = isNowRef;
          b.textContent = isNowRef ? 'reference ✓' : 'set as reference';
        });
        const pinBtn = panel.querySelector(`[data-pin-cand-key="${CSS.escape(cand.key)}"]`);
        if (pinBtn){ pinBtn.disabled = true; pinBtn.textContent = 'pinned ✓'; }
      });
    });
  }

  async function doSummitSearch(term){
    const panel = document.getElementById('search-panel');
    const trimmed = term.trim();
    if (!trimmed){ panel.innerHTML = ''; panel.classList.remove('show'); return; }

    const cacheKey = trimmed.toLowerCase();
    const cached = summitSearchCache.get(cacheKey);
    if (cached){
      renderPinCandidateResults(cached.map(candidateFromSearchResult).filter(c => c.lat != null), 'no summits found.');
      return;
    }

    if (summitSearchAbortController) summitSearchAbortController.abort();
    const controller = new AbortController();
    summitSearchAbortController = controller;

    panel.innerHTML = '<div class="search-hint">searching…</div>';
    panel.classList.add('show');
    let results;
    try { results = await searchSummits(trimmed, controller.signal); }
    catch (err) {
      if (err.name === 'AbortError') return; // superseded by a newer search
      panel.innerHTML = `<div class="search-hint">search failed (${escapeHtml(err.message)}).</div>`;
      return;
    }
    summitSearchCache.set(cacheKey, results);
    renderPinCandidateResults(results.map(candidateFromSearchResult).filter(c => c.lat != null), 'no summits found.');
  }

  // OSM tags some peaks with their SOTA reference (`communication:amateur_
  // radio:sota=ASSOC/CODE`, documented at wiki.openstreetmap.org/wiki/Key:
  // communication:amateur_radio:sota) — queryable by area via Overpass,
  // which SOTA's own API can't do (no bulk/region listing endpoint).
  // Coverage is crowd-sourced and sparse (~5% of Austria's summits, ~1.5%
  // worldwide, checked live via taginfo/Overpass) — a useful complement to
  // search-and-pin for browsing an area, not a complete listing.
  const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';
  const AREA_SEARCH_MAX_SPAN_DEG = 4; // keep queries small/fast and Overpass-fair-use-friendly

  async function searchOsmSummitsInView(bounds){
    const query = `[out:json][timeout:25];node["communication:amateur_radio:sota"](${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()});out body;`;
    const res = await fetch(OVERPASS_URL, { method: 'POST', body: query });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    // The public Overpass instance occasionally answers a busy/overloaded
    // moment with an HTML error page instead of JSON, even on a 200 — seen
    // live while testing this. Give a clear message rather than an opaque
    // "Unexpected token '<'" JSON-parse crash.
    let data;
    try { data = await res.json(); }
    catch { throw new Error('Overpass returned an unexpected response (it may be busy — try again shortly)'); }
    return Array.isArray(data.elements) ? data.elements : [];
  }

  function candidateFromOsmElement(el){
    const key = el.tags && el.tags['communication:amateur_radio:sota'];
    if (!key) return null;
    const pointsRaw = el.tags['communication:amateur_radio:sota:points'];
    return {
      key, ...splitSummitKey(key),
      name: el.tags.name || key,
      altM: el.tags.ele ? Math.round(parseFloat(el.tags.ele)) : null,
      points: pointsRaw ? parseInt(pointsRaw, 10) : null,
      lat: el.lat, lon: el.lon,
    };
  }

  async function doAreaSearch(){
    const panel = document.getElementById('search-panel');
    const bounds = map.getBounds();
    if (bounds.getNorth() - bounds.getSouth() > AREA_SEARCH_MAX_SPAN_DEG || bounds.getEast() - bounds.getWest() > AREA_SEARCH_MAX_SPAN_DEG){
      panel.innerHTML = '<div class="search-hint">zoom in further before searching this area (keeps the query small and fast).</div>';
      panel.classList.add('show');
      return;
    }
    panel.innerHTML = '<div class="search-hint">searching OpenStreetMap for tagged summits in view…</div>';
    panel.classList.add('show');
    let elements;
    try { elements = await searchOsmSummitsInView(bounds); }
    catch (err) { panel.innerHTML = `<div class="search-hint">OSM search failed (${escapeHtml(err.message)}).</div>`; return; }
    const cands = elements.map(candidateFromOsmElement).filter(c => c && c.lat != null);
    renderPinCandidateResults(cands, 'no OSM-tagged SOTA summits found in this view (coverage is partial — most summits aren\'t tagged in OSM yet).');
  }

  /* ---------- top-level state + orchestration ---------- */

  const state = {
    rawAlerts: [],
    bounds: null,
    summitMap: new Map(),
    referenceKey: null, // "ASSOC/CODE" of the summit chosen as the distance/elevation reference point, if any
    candidates: loadCandidates(), // pinned summits (searched by name/code), independent of whether they currently have an alert
    userLocation: null, // {lat, lon} from the browser's geolocation API, or null if unavailable/denied
    selectedBands: loadStringSet(LS_KEY_BANDS), // empty set = no band filter (show all)
    selectedModes: loadStringSet(LS_KEY_MODES), // empty set = no mode filter (show all)
    timeDisplay: 'utc', // 'utc' | 'local' — set for real by initTimeDisplay() during init(), before anything renders
  };

  // Resolves to {lat, lon} or null — never rejects, so callers don't need
  // try/catch for the (expected, non-error) cases of no API, denial, or
  // timeout. A short timeout keeps this from blocking the UI noticeably if
  // the browser is slow to get a fix or the permission prompt is ignored.
  function tryGeolocate(){
    return new Promise(resolve => {
      if (!('geolocation' in navigator)){ resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        () => resolve(null),
        { timeout: 6000, maximumAge: 300000 }
      );
    });
  }

  async function loadAlerts(){
    try {
      const raw = await fetchAlerts();
      state.rawAlerts = raw.map(normalizeAlert);
    } catch (err) {
      state.rawAlerts = [];
      addWarning(`could not load SOTA alerts (${err.message}). If this persists it may be a CORS/network problem — check the browser console.`);
      console.error(err);
    }
    state.bounds = computeDataBounds(state.rawAlerts);
    if (state.bounds){
      const fromEl = document.getElementById('range-from');
      const toEl = document.getElementById('range-to');
      // SOTA's feed isn't a strict rolling window — most alerts cluster in
      // the next few days, but a handful get posted far in advance (seen
      // live: one alert dated ~2 years out among ~350 mostly-near-term
      // ones). Using the literal max as the default "to" date would make
      // the initial view absurdly wide, so default to a 14-day window from
      // the earliest available date and expose the true bounds via
      // min/max on the inputs so users can still reach further-out alerts.
      fromEl.min = toEl.min = state.bounds.min;
      fromEl.max = toEl.max = state.bounds.max;
      if (!fromEl.value) fromEl.value = state.bounds.min;
      if (!toEl.value) toEl.value = capDefaultToDate(state.bounds.min, state.bounds.max);
    }
  }

  async function loadSummits(force){
    const groups = groupAlertsBySummit(state.rawAlerts);
    const entries = [...groups.values()].map(g => ({ key: g.key, assoc: g.associationCode, code: g.summitCode }));
    state.summitMap = await resolveSummits(entries, force);
  }

  function updateStats(visible, groups, ownSet){
    const mine = visible.filter(a => isOwnAlert(a, ownSet)).length;
    const onMap = [...groups.values()].filter(g => state.summitMap.has(g.key)).length;
    document.getElementById('stats').innerHTML =
      `<b>${visible.length}</b> alerts · <b>${onMap}</b> summits on map · <b>${mine}</b> yours`;
    const refEl = document.getElementById('ref-indicator');
    if (state.referenceKey){
      const ref = state.summitMap.get(state.referenceKey);
      refEl.innerHTML = `reference: <b>${escapeHtml(ref ? ref.name : state.referenceKey)}</b> (${escapeHtml(state.referenceKey)}) ` +
        `<button type="button" id="btn-clear-ref-toolbar">✕</button>`;
      document.getElementById('btn-clear-ref-toolbar').addEventListener('click', () => {
        state.referenceKey = null;
        renderAll();
      });
    } else {
      refEl.textContent = '';
    }
  }

  function checkPastRangeNote(to){
    const todayUtc = new Date().toISOString().slice(0, 10);
    if (to && to < todayUtc){
      addWarning(`You're viewing a fully past date range — SOTA's alerts feed only shows planned activations, not confirmed ones (and this tool doesn't have a historical archive). For a summit's actual activation history, open its popup and use the "sotadata ↗" or "sotl.as ↗" link.`);
    }
  }

  // fitView: only true for triggers that legitimately change what should
  // be in view (initial load, alerts refresh, date range change) — see
  // renderMarkers() for why this matters.
  function renderAll(fitView = false){
    clearWarnings();
    const from = document.getElementById('range-from').value;
    const to = document.getElementById('range-to').value;
    const ownSet = parseOwnCallsigns(document.getElementById('callsigns-input').value);
    checkPastRangeNote(to);
    const dateFiltered = filterAlertsByRange(state.rawAlerts, from, to);
    checkRangeWarning(from, to, state.bounds);
    // Facet checkboxes are built from the date-filtered set (not yet
    // band/mode-filtered) so all currently-relevant options stay offered
    // regardless of which ones are checked right now.
    renderBandModeFacets(dateFiltered);
    const visible = dateFiltered.filter(a => matchesBandModeFilter(a, state.selectedBands, state.selectedModes));
    const groups = groupAlertsBySummit(visible);
    // Fold in pinned candidate summits that don't already have an alert in
    // this window — search results already carry lat/lon, so no separate
    // per-summit fetch is needed to place them on the map.
    for (const [key, cand] of state.candidates){
      if (!groups.has(key)) groups.set(key, { key, associationCode: cand.assoc, summitCode: cand.code, alerts: [] });
      if (!state.summitMap.has(key)) state.summitMap.set(key, cand);
    }
    checkMissingSummits(groups, state.summitMap);
    renderMarkers(groups, state.summitMap, ownSet, state.referenceKey, state.candidates, fitView);
    renderAlertList(visible, ownSet, state.summitMap, state.referenceKey);
    renderCandidatesList(state.candidates, state.summitMap, state.referenceKey);
    renderAllSummitsOverlay(); // re-exclude/-include summits that just became (un)pinned or the reference
    updateStats(visible, groups, ownSet);
  }

  /* ---------- theme (light / dark / auto) — same pattern as the ADIF editor ---------- */

  function applyTheme(mode){
    if (mode === 'light' || mode === 'dark'){
      document.documentElement.setAttribute('data-theme', mode);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    document.querySelectorAll('#theme-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.themeChoice === mode);
    });
  }
  function initTheme(){
    let saved = 'auto';
    try { saved = localStorage.getItem(THEME_KEY) || 'auto'; } catch { /* ignore */ }
    applyTheme(saved);
    document.querySelectorAll('#theme-toggle button').forEach(b => {
      b.addEventListener('click', () => {
        const mode = b.dataset.themeChoice;
        try { localStorage.setItem(THEME_KEY, mode); } catch { /* ignore */ }
        applyTheme(mode);
      });
    });
  }

  // UTC/local time display — same toggle-group pattern as the theme
  // switch above, except changing it needs a re-render (every alert time
  // on screen goes through timeDisplayPair(), keyed off state.timeDisplay).
  function applyTimeDisplayButtons(){
    document.querySelectorAll('#time-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.timeChoice === state.timeDisplay);
    });
  }
  function initTimeDisplay(){
    let saved = 'utc';
    try { saved = localStorage.getItem(LS_KEY_TIME_DISPLAY) || 'utc'; } catch { /* ignore */ }
    state.timeDisplay = (saved === 'local') ? 'local' : 'utc';
    applyTimeDisplayButtons();
    document.querySelectorAll('#time-toggle button').forEach(b => {
      b.addEventListener('click', () => {
        state.timeDisplay = b.dataset.timeChoice;
        try { localStorage.setItem(LS_KEY_TIME_DISPLAY, state.timeDisplay); } catch { /* ignore */ }
        applyTimeDisplayButtons();
        renderAll();
      });
    });
  }

  /* ---------- event wiring ---------- */

  function wireEvents(){
    // A changed date range is a deliberate re-scope, so re-frame the view
    // (unlike most other listeners below, which pass no argument and so
    // leave the current pan/zoom alone — see renderAll()'s fitView param).
    document.getElementById('range-from').addEventListener('change', () => renderAll(true));
    document.getElementById('range-to').addEventListener('change', () => renderAll(true));
    document.getElementById('btn-today').addEventListener('click', () => {
      const todayUtc = new Date().toISOString().slice(0, 10);
      document.getElementById('range-from').value = todayUtc;
      document.getElementById('range-to').value = todayUtc;
      renderAll(true); // date range change: re-frame the view, same as editing the fields directly
    });
    document.getElementById('callsigns-input').addEventListener('change', e => {
      persistOwnCallsigns(e.target.value);
      renderAll();
    });
    document.getElementById('btn-share').addEventListener('click', async () => {
      const btn = document.getElementById('btn-share');
      const url = buildShareUrl();
      const original = btn.textContent;
      let copied = false;
      try { await navigator.clipboard.writeText(url); copied = true; }
      catch { /* clipboard blocked/unavailable — fall back to a manually-copyable prompt below */ }
      if (!copied) window.prompt('copy this share link:', url);
      btn.textContent = copied ? 'link copied ✓' : 'link ready ✓';
      setTimeout(() => { btn.textContent = original; }, 2000);
    });
    document.getElementById('btn-open-sotlas').addEventListener('click', () => {
      window.open(sotlasUrlForCurrentView(), '_blank', 'noopener');
    });
    document.getElementById('btn-locate').addEventListener('click', async () => {
      const btn = document.getElementById('btn-locate');
      btn.disabled = true;
      const loc = await tryGeolocate();
      btn.disabled = false;
      if (loc){ state.userLocation = loc; map.setView([loc.lat, loc.lon], USER_LOCATION_ZOOM); }
      else addWarning('could not determine your location (denied, unavailable, or timed out).');
    });
    document.getElementById('btn-refresh-alerts').addEventListener('click', async () => {
      await loadAlerts();
      await loadSummits(false);
      renderAll(true); // whole alert set just changed, re-frame to it
    });
    document.getElementById('btn-refresh-summits').addEventListener('click', async () => {
      await loadSummits(true);
      renderAll();
    });
    document.getElementById('btn-toggle-toolbar').addEventListener('click', () => {
      const controls = document.getElementById('toolbar-controls');
      const btn = document.getElementById('btn-toggle-toolbar');
      const shown = controls.classList.toggle('show');
      btn.setAttribute('aria-expanded', String(shown));
      btn.textContent = shown ? 'filters ▴' : 'filters ▾';
    });
    document.getElementById('btn-toggle-list').addEventListener('click', () => {
      document.getElementById('list-panel').classList.toggle('show');
    });
    document.getElementById('btn-toggle-bandmode').addEventListener('click', () => {
      document.getElementById('bandmode-panel').classList.toggle('show');
    });
    document.getElementById('btn-toggle-all-summits').addEventListener('click', async () => {
      const btn = document.getElementById('btn-toggle-all-summits');
      allSummitsEnabled = !allSummitsEnabled;
      btn.classList.toggle('active', allSummitsEnabled);
      if (!allSummitsEnabled){
        allSummitsLayer.clearLayers();
        map.removeLayer(allSummitsLayer);
        document.getElementById('all-summits-note').textContent = '';
        return;
      }
      allSummitsLayer.addTo(map);
      if (!allSummitsData){
        btn.disabled = true;
        document.getElementById('all-summits-note').textContent = 'loading…';
        try { await loadAllSummitsData(); }
        catch (err) {
          allSummitsEnabled = false;
          btn.classList.remove('active');
          map.removeLayer(allSummitsLayer);
          addWarning(`could not load the all-summits data (${err.message}). It's a build-time-generated file — if you're running this locally without having run "just fetch", it won't exist yet.`);
          document.getElementById('all-summits-note').textContent = '';
          btn.disabled = false;
          return;
        }
        btn.disabled = false;
      }
      renderAllSummitsOverlay();
    });
    document.getElementById('btn-clear-bandmode').addEventListener('click', () => {
      state.selectedBands.clear();
      state.selectedModes.clear();
      saveStringSet(LS_KEY_BANDS, state.selectedBands);
      saveStringSet(LS_KEY_MODES, state.selectedModes);
      renderAll();
    });
    // Checkbox groups are rebuilt every render (facet options can change as
    // the date range changes), so delegate on the stable container rather
    // than binding per-checkbox.
    function wireFacetGroup(containerId, selectedSet, lsKey){
      document.getElementById(containerId).addEventListener('change', e => {
        if (e.target.type !== 'checkbox') return;
        if (e.target.checked) selectedSet.add(e.target.value);
        else selectedSet.delete(e.target.value);
        saveStringSet(lsKey, selectedSet);
        renderAll();
      });
    }
    wireFacetGroup('band-checks', state.selectedBands, LS_KEY_BANDS);
    wireFacetGroup('mode-checks', state.selectedModes, LS_KEY_MODES);
    // Event delegation: list items are rebuilt on every renderAll(), so a
    // single listener on the (stable) container beats rebinding per item.
    document.getElementById('list-items').addEventListener('click', e => {
      const item = e.target.closest('.list-item');
      if (!item) return;
      const key = item.dataset.summitKey;
      state.referenceKey = (state.referenceKey === key) ? null : key;
      renderAll();
    });
    // Candidates have their own "remove pin" button, which stops
    // propagation (see renderCandidatesList) so it doesn't also toggle
    // the reference selection here.
    document.getElementById('candidates-items').addEventListener('click', e => {
      const item = e.target.closest('.list-item');
      if (!item) return;
      const key = item.dataset.summitKey;
      state.referenceKey = (state.referenceKey === key) ? null : key;
      renderAll();
    });
    document.getElementById('btn-summit-search').addEventListener('click', () => {
      clearTimeout(summitSearchDebounceTimer);
      doSummitSearch(document.getElementById('summit-search').value);
    });
    document.getElementById('summit-search').addEventListener('keydown', e => {
      if (e.key === 'Enter'){ clearTimeout(summitSearchDebounceTimer); doSummitSearch(e.target.value); }
    });
    // Auto-search once there's enough to search for, debounced so it fires
    // after typing pauses rather than on every keystroke (polite to the
    // API, and avoids a flash of "no summits found" for a term still being
    // typed). Below 3 characters, clear any stale results instead of
    // leaving an outdated list on screen — Enter/the button still work
    // regardless of length if you want to search a 1-2 character term.
    document.getElementById('summit-search').addEventListener('input', e => {
      clearTimeout(summitSearchDebounceTimer);
      const term = e.target.value.trim();
      if (term.length < 3){
        document.getElementById('search-panel').innerHTML = '';
        document.getElementById('search-panel').classList.remove('show');
        return;
      }
      summitSearchDebounceTimer = setTimeout(() => doSummitSearch(term), 350);
    });
    document.getElementById('btn-area-search').addEventListener('click', doAreaSearch);
  }

  /* ---------- init ---------- */

  async function init(){
    initTheme();
    initTimeDisplay();
    initMap();
    document.getElementById('callsigns-input').value = loadOwnCallsignsRaw();
    wireEvents();
    // A returning visitor's restored view (see initMap()/loadSavedMapView())
    // takes priority over both of these — geolocation and the initial
    // fit-to-alerts are both "we have nothing better to go on" fallbacks
    // for a first-time visitor, not something that should override a view
    // the visitor already chose and left behind last time.
    const hasSavedView = !!loadSavedMapView();
    // A shared link (see applySharedStateFromUrl()) explicitly asks to look
    // at something specific, which should win over "restore my last view"
    // the same way it wins over "start from nothing" — reassigned below
    // once we know; read by the geolocation callback via closure, so it's
    // declared before that's registered.
    let appliedSharedState = false;
    // Not awaited: geolocation (permission prompt + fix) can take a while
    // and shouldn't block loading alerts. If it resolves before there's
    // anything else to show, use it; if it resolves after, it's a no-op
    // (real data already framed the view — see renderMarkers()).
    tryGeolocate().then(loc => {
      state.userLocation = loc;
      if (loc && !hasSavedView && !appliedSharedState && markerLayer.getLayers().length === 0){
        map.setView([loc.lat, loc.lon], USER_LOCATION_ZOOM);
      }
    });
    appliedSharedState = await applySharedStateFromUrl();
    await loadAlerts();
    await loadSummits(false);
    // first-ever visit or a shared link: frame to whatever's there;
    // otherwise (returning visitor, no shared link) keep their restored view
    renderAll(appliedSharedState || !hasSavedView);
  }

  init();
})();
</script>
</body>
</html>
