<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOTA Alerts Map</title>
<meta name="color-scheme" content="light dark">
<!-- Theme first (sets data-theme before anything paints), then the shared
     tokens, Leaflet's styles and the page's own. -->
<script src="../shared/js/theme.js"></script>
<link rel="stylesheet" href="../shared/css/tools.css">
<link rel="stylesheet" href="../shared/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="site-header">
  <a id="back-link" href="../">
    <svg class="icon-arrow-left" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    back to site
  </a>
  <span class="spacer"></span>
  <div id="time-toggle" class="toggle-group" role="group" aria-label="time display" title="show alert times in UTC or your local time zone">
    <button type="button" data-time-choice="utc" aria-pressed="false">UTC</button>
    <button type="button" data-time-choice="local" aria-pressed="false">local</button>
  </div>
  <!-- wired by ../shared/js/theme.js (aria-pressed + .active, stored choice) -->
  <div id="theme-toggle" class="toggle-group" role="group" aria-label="color theme">
    <button type="button" data-theme-choice="light" aria-pressed="false" title="light theme">light</button>
    <button type="button" data-theme-choice="auto" aria-pressed="false" title="match system theme">auto</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false" title="dark theme">dark</button>
  </div>
  <span class="badge">unofficial · uses SOTA's public API, not affiliated with the SOTA Association</span>
</header>

<div id="toolbar">
  <h1>SOTA Alerts Map</h1>
  <span class="sep" aria-hidden="true">/</span>
  <!-- Hidden except at phone widths (see the max-width:600px media query) —
       everything below collapses behind this on a phone so the map gets
       the screen instead of a wall of controls; desktop/tablet render
       #toolbar-controls' children as if this wrapper weren't there at all
       (display:contents), so this button and class have zero effect there. -->
  <button type="button" id="btn-toggle-toolbar" class="mobile-only" aria-expanded="false" aria-controls="toolbar-controls">filters ▾</button>
  <div id="toolbar-controls">
    <div class="field">
      <label for="range-from">date range (UTC)</label>
      <div class="date-range-group">
        <input id="range-from" type="date" aria-label="from date (UTC)">
        <span class="date-range-arrow" aria-hidden="true">→</span>
        <input id="range-to" type="date" aria-label="to date (UTC)">
      </div>
    </div>
    <button type="button" id="btn-today" title="jump the date range to today (UTC)">today</button>
    <div class="field">
      <label for="callsigns-input">my callsign(s)</label>
      <input id="callsigns-input" type="text" placeholder="OE1ABC, OE1ABC/P">
    </div>
    <div class="field">
      <label for="summit-search">pin a summit</label>
      <input id="summit-search" type="text" placeholder="name or code…">
      <div class="field-actions">
        <button type="button" id="btn-summit-search">search</button>
        <button type="button" id="btn-area-search" title="find summits tagged in OpenStreetMap within the current map view (coverage is partial)">find in view</button>
      </div>
    </div>
    <div class="spacer"></div>
    <button type="button" id="btn-share" title="copy a link that reproduces this date range, reference summit, and pinned summits">share</button>
    <span id="share-status" class="sr-only" role="status"></span>
    <button type="button" id="btn-open-sotlas" title="open sotl.as, centered on the same area this map is currently showing">view on sotl.as ↗</button>
    <button type="button" id="btn-locate" title="center the map on your current location">locate me</button>
    <button type="button" id="btn-refresh-alerts">refresh alerts</button>
    <button type="button" id="btn-refresh-summits" title="force re-fetch of summit coordinates, bypassing the local cache">refresh summit data</button>
    <button type="button" id="btn-toggle-bandmode" aria-expanded="false" aria-controls="bandmode-panel">bands/modes ▾</button>
    <button type="button" id="btn-toggle-all-summits" aria-pressed="false" title="show every SOTA summit in the current view (not just alerted/pinned ones) — built at site build time, no live SOTA API calls">all summits</button>
    <span id="all-summits-note" role="status"></span>
    <button type="button" id="btn-toggle-list" aria-expanded="false" aria-controls="list-panel">list ▾</button>
  </div>
</div>

<div id="statusbar">
  <span id="stats"></span>
  <span id="ref-indicator"></span>
</div>

<!-- Screen-reader announcement of the search panel's state (searching…,
     n results, failed); the panel itself holds the full result cards. -->
<div id="search-status" class="sr-only" role="status"></div>
<div id="search-panel" role="region" aria-label="summit search results"></div>

<div id="bandmode-panel">
  <div class="bandmode-group" role="group" aria-labelledby="band-checks-title">
    <div class="bandmode-group-title" id="band-checks-title">band</div>
    <div id="band-checks" class="bandmode-checks"></div>
  </div>
  <div class="bandmode-group" role="group" aria-labelledby="mode-checks-title">
    <div class="bandmode-group-title" id="mode-checks-title">mode</div>
    <div id="mode-checks" class="bandmode-checks"></div>
  </div>
  <button type="button" id="btn-clear-bandmode" class="btn-ref">clear filter</button>
</div>

<div id="warnings" role="status"></div>

<main id="main">
  <div id="map" role="region" aria-label="map of SOTA alerts and summits"></div>
  <div id="list-panel" role="region" aria-label="alert and pinned summit list"><div id="candidates-items"></div><div id="list-items"></div></div>
</main>

<script src="../shared/vendor/leaflet/leaflet.js"></script>
<!-- ES modules (js/, plus ../shared/js/), served over http only. -->
<script type="module" src="js/app.js"></script>
</body>
</html>
