<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOTA Alerts Map</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root{
    --bg: #ffffff;
    --bg-raised: #f5f5f5;
    --line: #0000000d;
    --text: #000000de;
    --text-dim: #00000099;
    --accent: #526cfe;
    --accent-dim: #6b78d0;
    --own: #008300;
    --warn: #9a6700;
    --err: #c62828;
    --header-bg: rgba(255,255,255,.72);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace;
    color-scheme: light;
    --leaflet-layers-icon-filter: none;
    /* Pin/marker categorical colors, validated with the dataviz skill's
       CVD-simulation checker (all-pairs mode, since any two pin categories
       can sit side by side on the map) — see oe1ebg/tools/sota-alerts/README.md.
       --pin-default is separate from --accent on purpose: --accent is the
       toolbar's button/link color and shouldn't change just because the
       pin palette does. */
    --pin-default: #2a78d6;
    --candidate: #e87ba4;
    --route: #eda100;
  }
  @media (prefers-color-scheme: dark){
    /* Without this, native form-control chrome (the <input type=date>
       calendar icon in particular) keeps rendering in its light-mode
       colors — a near-black icon on a near-black input, invisible enough
       to look like the picker button is simply missing. */
    :root{
      --bg: hsla(225,15%,5%,1);
      --bg-raised: hsla(225,20%,10%,1);
      --line: hsla(225,15%,90%,.12);
      --text: hsla(225,15%,90%,.82);
      --text-dim: hsla(225,15%,90%,.5);
      --accent: #526cfe;
      --accent-dim: #9aa8f5;
      --own: #008300;
      --warn: #e0b35c;
      --err: #e0776b;
      --header-bg: rgba(12,13,15,.72);
      color-scheme: dark;
      --leaflet-layers-icon-filter: invert(1) hue-rotate(180deg);
      --pin-default: #3987e5;
      --candidate: #d55181;
      --route: #c98500;
    }
  }
  /* Explicit light/dark override (higher specificity than the bare :root rules
     above), set via the theme toggle + a data-theme attribute on <html>. No
     attribute at all = "auto", i.e. follows prefers-color-scheme. Every
     variable that has a light/dark-dependent value must be repeated here too. */
  :root[data-theme="dark"]{
    --bg: hsla(225,15%,5%,1);
    --bg-raised: hsla(225,20%,10%,1);
    --line: hsla(225,15%,90%,.12);
    --text: hsla(225,15%,90%,.82);
    --text-dim: hsla(225,15%,90%,.5);
    --accent: #526cfe;
    --accent-dim: #9aa8f5;
    --own: #008300;
    --warn: #e0b35c;
    --err: #e0776b;
    --header-bg: rgba(12,13,15,.72);
    color-scheme: dark;
    --leaflet-layers-icon-filter: invert(1) hue-rotate(180deg);
    --pin-default: #3987e5;
    --candidate: #d55181;
    --route: #c98500;
  }
  :root[data-theme="light"]{
    --bg: #ffffff;
    --bg-raised: #f5f5f5;
    --line: #0000000d;
    --text: #000000de;
    --text-dim: #00000099;
    --accent: #526cfe;
    --accent-dim: #6b78d0;
    --own: #008300;
    --warn: #9a6700;
    --err: #c62828;
    --header-bg: rgba(255,255,255,.72);
    color-scheme: light;
    --leaflet-layers-icon-filter: none;
    --pin-default: #2a78d6;
    --candidate: #e87ba4;
    --route: #eda100;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    font-size:13px;
    line-height:1.4;
    display:flex;
    flex-direction:column;
  }
  #site-header{
    display:flex;
    align-items:center;
    gap:.8em;
    padding:.5em .8em;
    position:sticky;
    top:0;
    z-index:20;
    background:var(--header-bg);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  #back-link{
    display:inline-flex;
    align-items:center;
    gap:.4em;
    color:var(--accent);
    text-decoration:none;
    font-size:12px;
  }
  #back-link:hover{ text-decoration:underline; }
  .icon-arrow-left{ width:1em; height:1em; }
  .badge{
    border:1px solid var(--line);
    border-radius:.4rem;
    padding:.15em .6em;
    color:var(--text-dim);
    font-size:11px;
    white-space:nowrap;
    text-decoration:none;
  }
  a.badge:hover{ color:var(--accent); border-color:var(--accent-dim); }
  .toggle-group{
    display:flex;
    border:1px solid var(--line);
    border-radius:.3rem;
    overflow:hidden;
  }
  .toggle-group button{
    border:none;
    border-radius:0;
    padding:.3em .6em;
    font-size:11px;
    background:transparent;
    color:var(--text-dim);
  }
  .toggle-group button:not(:first-child){ border-left:1px solid var(--line); }
  .toggle-group button.active{
    background:var(--accent);
    color:#fff;
  }
  #toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:.6em 1em;
    padding:.6em .8em;
    background:var(--bg-raised);
    border-bottom:1px solid var(--line);
  }
  #toolbar h1{
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    margin:0;
    color:var(--text);
    white-space:nowrap;
  }
  #toolbar .sep{ color:var(--line); }
  #toolbar label{ color:var(--text-dim); font-size:11px; white-space:nowrap; }
  #toolbar .field{ display:flex; align-items:center; gap:.3em; }
  button, .btn{
    font-family:var(--font-ui);
    font-size:12px;
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent-dim);
    padding:.35em .7em;
    cursor:pointer;
    border-radius:.2rem;
  }
  button:hover, .btn:hover{ background:rgba(82,108,254,0.1); }
  button:disabled{ color:var(--text-dim); border-color:var(--line); cursor:not-allowed; }
  button.active{ background:var(--accent); color:#fff; }
  input[type=text], input[type=date]{
    font-family:var(--font-ui);
    font-size:12px;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--line);
    padding:.35em .5em;
    border-radius:.2rem;
  }
  input[type=text]:focus, input[type=date]:focus{
    outline:1px solid var(--accent);
    outline-offset:-1px;
  }
  #callsigns-input{ width:16em; }
  input[type=date]{ min-width:9.5em; }
  #all-summits-note{ color:var(--text-dim); font-size:11px; }
  .spacer{ flex:1; }

  /* A single-line status bar under the toolbar, always its own row —
     previously #stats/#ref-indicator lived inline in the toolbar's flex-wrap
     flow, where they'd land in an arbitrary, sometimes visually orphaned
     spot mid-row depending on viewport width and how many buttons wrapped
     around them. */
  #statusbar{
    display:flex;
    align-items:center;
    gap:.3em 1em;
    padding:.4em .8em;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  #stats{ color:var(--text-dim); }
  #stats b{ color:var(--text); font-weight:600; }
  #ref-indicator{ color:var(--route); white-space:nowrap; font-weight:600; }
  #ref-indicator button{ padding:0 .3em; font-size:11px; border:none; color:var(--text-dim); }

  /* Grouped "date range" control: from/to inputs presented as one pill
     (same visual language as .toggle-group) with an arrow between them,
     rather than two separately-labeled "from (UTC)"/"to (UTC)" fields
     repeating "(UTC)" and reading as unrelated. */
  .date-range-group{
    display:flex;
    align-items:stretch;
    border:1px solid var(--line);
    border-radius:.3rem;
    overflow:hidden;
    background:var(--bg);
  }
  .date-range-group input[type=date]{
    border:none;
    border-radius:0;
    background:transparent;
  }
  .date-range-group input[type=date]:focus{
    outline:1px solid var(--accent);
    outline-offset:-2px;
    z-index:1;
  }
  .date-range-arrow{
    display:flex;
    align-items:center;
    padding:0 .5em;
    color:var(--text-dim);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    font-size:11px;
  }

  #warnings{
    display:none;
    padding:.5em .8em;
    background:#1c1811;
    border-bottom:1px solid #3a2f1a;
    color:var(--warn);
    font-size:12px;
    max-height:6em;
    overflow:auto;
  }
  #warnings.show{ display:block; }
  #warnings div{ padding:.1em 0; }

  #search-panel{
    display:none;
    padding:.4em .8em;
    background:var(--bg-raised);
    border-bottom:1px solid var(--line);
    font-size:12px;
    max-height:10em;
    overflow:auto;
  }
  #search-panel.show{ display:block; }
  .search-hint{ color:var(--text-dim); padding:.2em 0; }
  .search-result{
    padding:.3em 0;
    border-bottom:1px solid var(--line);
  }
  .search-result:last-child{ border-bottom:none; }
  .search-result-top{ display:flex; align-items:center; justify-content:space-between; gap:.6em; }
  .search-result-actions{ display:flex; gap:.4em; flex-shrink:0; }
  .search-result button{ font-size:11px; padding:.2em .5em; white-space:nowrap; }
  .search-result button:disabled{ color:var(--candidate); border-color:var(--candidate); }
  .search-result-alert{ font-size:11px; color:var(--accent); margin-top:.2em; }

  #bandmode-panel{
    display:none;
    align-items:flex-start;
    gap:1.5em;
    padding:.5em .8em;
    background:var(--bg-raised);
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  #bandmode-panel.show{ display:flex; flex-wrap:wrap; }
  .bandmode-group{ display:flex; flex-direction:column; gap:.35em; }
  .bandmode-group-title{
    font-weight:600;
    font-size:11px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .bandmode-checks{ display:flex; flex-wrap:wrap; gap:.3em .9em; max-width:40em; }
  .chk{ display:inline-flex; align-items:center; gap:.35em; cursor:pointer; white-space:nowrap; }
  .chk input{ cursor:pointer; }

  #main{
    flex:1;
    display:flex;
    overflow:hidden;
    min-height:0;
  }
  #map{ flex:1; min-width:0; background:var(--bg-raised); }

  #list-panel{
    display:none;
    width:22em;
    flex-shrink:0;
    border-left:1px solid var(--line);
    overflow-y:auto;
    background:var(--bg);
  }
  #list-panel.show{ display:block; }
  .list-item{
    padding:.5em .7em;
    border-bottom:1px solid var(--line);
    border-left:3px solid transparent;
    font-size:12px;
  }
  .list-item{ cursor:pointer; }
  .list-item:hover{ background:rgba(82,108,254,0.06); }
  .list-item.own{ background:rgba(31,157,85,0.08); }
  /* Stronger than the "own"/"hover" tints on purpose — there's only ever
     one reference summit at a time, so it should be unmistakable, matching
     the bigger warn-colored marker on the map. */
  .list-item.is-ref{ background:color-mix(in srgb, var(--route) 18%, transparent); border-left-color:var(--route); }
  .li-top{ display:flex; justify-content:space-between; gap:.5em; }
  .li-top b{ color:var(--text); }
  .list-item.own .li-top b{ color:var(--own); }
  .li-summit{ color:var(--text-dim); font-family:var(--font-mono); font-size:11px; }
  .li-meta{ color:var(--text-dim); font-size:11px; margin-top:.2em; }
  .list-empty{ padding:1em .8em; color:var(--text-dim); }
  .ref-diff{ font-size:11px; color:var(--route); margin-top:.2em; }
  .list-section-title{
    padding:.4em .7em;
    font-size:11px;
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--candidate);
    background:var(--bg-raised);
    border-bottom:1px solid var(--line);
  }
  .list-item.candidate{ border-left-color:var(--candidate); }
  .list-item.candidate .li-top b{ color:var(--candidate); }
  /* A pinned summit that's also the current reference (common now that
     "set as reference" implicitly pins) should read as reference first —
     matches the map marker, where .reference's fill/size also wins over
     .candidate's. Needs to be explicit since .is-ref and .candidate have
     equal selector specificity and .candidate is declared later. */
  .list-item.is-ref.candidate{ border-left-color:var(--route); }
  .list-item .btn-ref{ margin-top:.3em; }

  @media (max-width: 760px){
    #main{ flex-direction:column; }
    #list-panel{ width:auto; max-height:40vh; border-left:none; border-top:1px solid var(--line); }
  }

  /* #toolbar-controls/.field-actions are only meaningful at phone widths
     (below) — display:contents here makes both wrappers invisible to
     layout otherwise, so their children behave exactly as if the wrappers
     didn't exist and desktop/tablet toolbar layout is untouched. */
  .mobile-only{ display:none; }
  #toolbar-controls{ display:contents; }
  .field-actions{ display:contents; }

  /* Phone layout: the toolbar's filters/actions are the main thing eating
     vertical space that should go to the map (confirmed live at 390×844 —
     they pushed the map below the fold entirely), so they collapse behind
     "filters ▾" by default; only the title and that toggle stay in the
     always-visible row. Also fixes #site-header wrapping the "back to
     site" link's own text mid-word at narrow widths (it was shrinking
     along with everything else with nowhere else to give). */
  @media (max-width: 600px){
    #site-header{ flex-wrap:wrap; }
    .badge{ flex-basis:100%; order:10; white-space:normal; }

    .mobile-only{ display:inline-flex; }

    #toolbar-controls{
      display:none;
      flex-direction:column;
      align-items:stretch;
      width:100%;
      gap:.6em;
      margin-top:.4em;
    }
    #toolbar-controls.show{ display:flex; }
    #toolbar-controls .field{ flex-direction:column; align-items:stretch; gap:.25em; }
    #toolbar-controls .date-range-group input[type=date]{ min-width:0; flex:1; }
    #toolbar-controls #callsigns-input,
    #toolbar-controls #summit-search{ width:auto; }
    #toolbar-controls .field-actions{ display:flex; gap:.4em; }
    #toolbar-controls .field-actions button{ flex:1; }
    #toolbar-controls .spacer{ display:none; }
    #toolbar-controls > button{ width:100%; }

    /* Bigger touch targets — the desktop sizing (padding:.35em) measures
       out to a ~22px tall hit area, well under the ~44px platform
       guideline for a touch target. */
    button, .btn{ padding:.6em .8em; font-size:13px; }
    input[type=text], input[type=date]{ padding:.6em .6em; font-size:13px; }

    /* Search/"find in view" result cards: the name text and "set as
       reference"/"+ pin" buttons were squeezed into one row (space-between)
       — fine on desktop, cramped on a phone-width card. */
    .search-result-top{ flex-wrap:wrap; }
    .search-result-actions{ width:100%; }
    .search-result-actions button{ flex:1; }
  }

  /* Leaflet overrides so popups/controls follow the page's own light/dark theme
     instead of Leaflet's hardcoded white/black defaults. */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip{ background:var(--bg); color:var(--text); }
  .leaflet-container a.leaflet-popup-close-button{ color:var(--text-dim); }
  .leaflet-bar a{ background:var(--bg-raised); color:var(--text); border-bottom:1px solid var(--line); }
  .leaflet-bar a:hover{ background:var(--bg); }
  .leaflet-control-attribution{ background:var(--header-bg); color:var(--text-dim); }
  .leaflet-control-attribution a{ color:var(--accent); }
  .leaflet-control-layers{ background:var(--bg-raised); color:var(--text); }
  .leaflet-control-layers-toggle{ filter: var(--leaflet-layers-icon-filter, none); }
  .leaflet-control-layers-separator{ border-color:var(--line); }

  .sota-pin{ width:26px; height:34px; }
  .sota-pin svg{ width:100%; height:100%; display:block; } /* the <svg> has no size of its own — this makes the wrapping div's width/height (below) the actual source of truth for icon size, which the .reference/.candidate rules then override */
  .sota-pin.default path{ fill:var(--pin-default); }
  .sota-pin.own path{ fill:var(--own); }
  /* Plain, solid fill colors — a drop-shadow glow/outline turned out too
     subtle to notice twice in a row, so each state just gets its own
     unmistakable pin color instead of a color plus an effect layered on
     top. Priority when a summit is more than one of these at once:
     reference > candidate > own > default (there's only ever one
     reference; many summits can be pinned or "yours"). */
  .sota-pin.candidate{ width:28px; height:37px; }
  .sota-pin.candidate path{ fill:var(--candidate); }
  .sota-pin.reference{ width:32px; height:42px; }
  .sota-pin.reference path{ fill:var(--route); }
  .sota-pin circle{ fill:#fff; }

  .sota-popup{ font-size:12px; max-width:20em; }
  .sota-popup .popup-title{ font-weight:600; margin-bottom:.2em; }
  .sota-popup .popup-title .code{ font-family:var(--font-mono); font-weight:400; color:var(--text-dim); }
  .sota-popup .popup-meta{ color:var(--text-dim); margin-bottom:.5em; }
  .sota-popup .popup-meta a{ color:var(--accent); }
  .sota-popup .alert-row{ padding:.3em 0; border-top:1px solid var(--line); }
  .sota-popup .alert-row.own b{ color:var(--own); }
  .sota-popup .freq{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); }
  .sota-popup .comment{ font-size:11px; color:var(--text-dim); margin-top:.15em; }
  .sota-popup .ref-diff{ margin-bottom:.3em; }
  .sota-popup .popup-ref{ margin-bottom:.3em; }
  .popup-empty{ color:var(--text-dim); font-size:11px; padding:.3em 0; border-top:1px solid var(--line); }
  .btn-ref{
    font-family:var(--font-ui);
    font-size:11px;
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent-dim);
    padding:.2em .5em;
    cursor:pointer;
    border-radius:.2rem;
  }
  .btn-ref:hover{ background:rgba(82,108,254,0.1); }
  .btn-ref.danger{ color:var(--err); border-color:var(--err); }
</style>
</head>
<body>

<header id="site-header">
  <a id="back-link" href="../">
    <svg class="icon-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    back to site
  </a>
  <span class="spacer"></span>
  <div id="time-toggle" class="toggle-group" role="group" aria-label="time display" title="show alert times in UTC or your local time zone">
    <button type="button" data-time-choice="utc">UTC</button>
    <button type="button" data-time-choice="local">local</button>
  </div>
  <div id="theme-toggle" class="toggle-group" role="group" aria-label="color theme">
    <button type="button" data-theme-choice="light" title="light theme">light</button>
    <button type="button" data-theme-choice="auto" title="match system theme">auto</button>
    <button type="button" data-theme-choice="dark" title="dark theme">dark</button>
  </div>
  <span class="badge">unofficial · uses SOTA's public API, not affiliated with the SOTA Association</span>
</header>

<div id="toolbar">
  <h1>SOTA ALERTS MAP</h1>
  <span class="sep">/</span>
  <!-- Hidden except at phone widths (see the max-width:600px media query) —
       everything below collapses behind this on a phone so the map gets
       the screen instead of a wall of controls; desktop/tablet render
       #toolbar-controls' children as if this wrapper weren't there at all
       (display:contents), so this button and class have zero effect there. -->
  <button type="button" id="btn-toggle-toolbar" class="mobile-only" aria-expanded="false">filters ▾</button>
  <div id="toolbar-controls">
    <div class="field">
      <label for="range-from">date range (UTC)</label>
      <div class="date-range-group">
        <input id="range-from" type="date" aria-label="from date (UTC)">
        <span class="date-range-arrow">→</span>
        <input id="range-to" type="date" aria-label="to date (UTC)">
      </div>
    </div>
    <button type="button" id="btn-today" title="jump the date range to today (UTC)">today</button>
    <div class="field">
      <label for="callsigns-input">my callsign(s)</label>
      <input id="callsigns-input" type="text" placeholder="OE1ABC, OE1ABC/P">
    </div>
    <div class="field">
      <label for="summit-search">pin a summit</label>
      <input id="summit-search" type="text" placeholder="name or code…">
      <div class="field-actions">
        <button type="button" id="btn-summit-search">search</button>
        <button type="button" id="btn-area-search" title="find summits tagged in OpenStreetMap within the current map view (coverage is partial)">find in view</button>
      </div>
    </div>
    <div class="spacer"></div>
    <button id="btn-share" title="copy a link that reproduces this date range, reference summit, and pinned summits">share</button>
    <button id="btn-open-sotlas" title="open sotl.as, centered on the same area this map is currently showing">view on sotl.as ↗</button>
    <button id="btn-locate" title="center the map on your current location">locate me</button>
    <button id="btn-refresh-alerts">refresh alerts</button>
    <button id="btn-refresh-summits" title="force re-fetch of summit coordinates, bypassing the local cache">refresh summit data</button>
    <button id="btn-toggle-bandmode">bands/modes ▾</button>
    <button type="button" id="btn-toggle-all-summits" title="show every SOTA summit in the current view (not just alerted/pinned ones) — built at site build time, no live SOTA API calls">all summits</button>
    <span id="all-summits-note"></span>
    <button id="btn-toggle-list">list ▾</button>
  </div>
</div>

<div id="statusbar">
  <span id="stats"></span>
  <span id="ref-indicator"></span>
</div>

<div id="search-panel"></div>

<div id="bandmode-panel">
  <div class="bandmode-group">
    <div class="bandmode-group-title">band</div>
    <div id="band-checks" class="bandmode-checks"></div>
  </div>
  <div class="bandmode-group">
    <div class="bandmode-group-title">mode</div>
    <div id="mode-checks" class="bandmode-checks"></div>
  </div>
  <button type="button" id="btn-clear-bandmode" class="btn-ref">clear filter</button>
</div>

<div id="warnings"></div>

<div id="main">
  <div id="map"></div>
  <div id="list-panel"><div id="candidates-items"></div><div id="list-items"></div></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- constants ---------- */

  const ALERTS_URL = 'https://api2.sota.org.uk/api/alerts';
  const summitUrl = (assoc, code) => `https://api2.sota.org.uk/api/summits/${encodeURIComponent(assoc)}/${encodeURIComponent(code)}`;
  // Same-origin, build-time-generated (oe1ebg/scripts/fetch_summits.py) sibling
  // of the "all summits" overlay's summits.json, but keyed for lookup and
  // much smaller (~9.8MB vs ~17.7MB) since it's fetched on essentially every
  // session rather than lazily on-demand — see resolveSummits() below.
  const SUMMIT_LOOKUP_URL = 'data/summit-lookup.json';

  const LS_KEY_CALLSIGNS = 'sota-alerts-callsigns';
  const LS_KEY_SUMMIT_CACHE = 'sota-alerts-summit-cache';
  const LS_KEY_CANDIDATES = 'sota-alerts-candidates';
  const LS_KEY_BANDS = 'sota-alerts-band-filter';
  const LS_KEY_MODES = 'sota-alerts-mode-filter';

  function loadStringSet(key){
    try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
    catch { return new Set(); }
  }
  function saveStringSet(key, set){
    try { localStorage.setItem(key, JSON.stringify([...set])); }
    catch { /* non-essential preference, fine to just not persist */ }
  }
  const summitSearchUrl = term => `https://api2.sota.org.uk/api/summits/search/${encodeURIComponent(term)}`;
  const SUMMIT_CACHE_TTL_MS = 30 * 24 * 60 * 60 * 1000; // summit metadata rarely changes; 30 days is generous
  const THEME_KEY = 'sota-alerts-theme';
  const LS_KEY_TIME_DISPLAY = 'sota-alerts-time-display';
  const FETCH_POOL_SIZE = 6; // small concurrency cap for per-summit lookups, be a polite API citizen
  const DEFAULT_RANGE_DAYS = 14; // default window width; see capDefaultToDate()
  const USER_LOCATION_ZOOM = 9; // regional view, not street-level — shared by every "center on me" case (initial geolocation, empty-state fallback, the "locate me" button) so they stay consistent

  const PIN_SVG = '<svg viewBox="0 0 26 34" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M13 0C5.8 0 0 5.8 0 13c0 9 13 21 13 21s13-12 13-21C26 5.8 20.2 0 13 0z" stroke="#fff" stroke-width="1.5"/>' +
    '<circle cx="13" cy="13" r="5"/></svg>';

  /* ---------- warnings (same pattern as the ADIF editor) ---------- */

  function addWarning(msg){
    const box = document.getElementById('warnings');
    const div = document.createElement('div');
    div.textContent = '⚠ ' + msg;
    box.appendChild(div);
    box.classList.add('show');
  }
  function clearWarnings(){
    const box = document.getElementById('warnings');
    box.innerHTML = '';
    box.classList.remove('show');
  }

  function escapeHtml(s){
    return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------- SOTA alerts fetch + normalize ---------- */

  async function fetchAlerts(){
    const res = await fetch(ALERTS_URL);
    if (!res.ok) throw new Error(`alerts request failed: HTTP ${res.status}`);
    return res.json();
  }

  function normalizeAlert(raw){
    return {
      id: raw.id,
      dateActivated: raw.dateActivated || '',
      associationCode: raw.associationCode || '',
      summitCode: raw.summitCode || '',
      summitDetails: raw.summitDetails || '',
      frequency: raw.frequency || '',
      comments: raw.comments || '',
      activatingCallsign: raw.activatingCallsign || '',
      activatorName: raw.activatorName || '',
      posterCallsign: raw.posterCallsign || '',
    };
  }

  function computeDataBounds(alerts){
    if (!alerts.length) return null;
    let min = alerts[0].dateActivated.slice(0, 10);
    let max = min;
    for (const a of alerts){
      const d = a.dateActivated.slice(0, 10);
      if (d < min) min = d;
      if (d > max) max = d;
    }
    return { min, max };
  }

  function filterAlertsByRange(alerts, from, to){
    return alerts.filter(a => {
      const d = a.dateActivated.slice(0, 10);
      return (!from || d >= from) && (!to || d <= to);
    });
  }

  // One-line "when · who" summary for a single alert, shared by the
  // distance-line hover label, search-result cards, and the pinned-
  // summits list — anywhere a summit needs to show "there's an alert
  // here" without the full popup.
  function formatTimeUTC(t){ return t.toISOString().slice(11, 16) + 'Z'; }
  // hour12:false forces 24h everywhere regardless of the browser's locale
  // default (many, e.g. en-US, would otherwise render 12h AM/PM) — the UTC
  // formatters above are already always-24h since they're built from
  // toISOString() directly rather than a locale-dependent formatter.
  function formatTimeLocal(t){ return t.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false }); }
  function formatDateTimeUTC(t){ return t.toISOString().slice(0, 16).replace('T', ' ') + 'Z'; }
  function formatDateTimeLocal(t){ return t.toLocaleString(undefined, { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }); }

  // Every alert-time display in the app goes through this, so the header's
  // UTC/local toggle (state.timeDisplay) changes them all consistently
  // instead of each place picking its own format. `primary` is whichever
  // zone the toggle currently selects; `secondary` (the other one, labeled)
  // is available for places that show both, like the marker popup.
  function timeDisplayPair(dateActivated, withDate){
    const t = new Date(dateActivated);
    if (isNaN(t)) return { primary: dateActivated, secondary: '' };
    const utc = withDate ? formatDateTimeUTC(t) : formatTimeUTC(t);
    const local = withDate ? formatDateTimeLocal(t) : formatTimeLocal(t);
    return state.timeDisplay === 'local'
      ? { primary: local, secondary: `UTC ${utc}` }
      : { primary: utc, secondary: `local ${local}` };
  }

  function formatAlertBrief(a){
    const when = timeDisplayPair(a.dateActivated, true).primary;
    const who = a.activatorName ? `${a.activatingCallsign} (${a.activatorName})` : a.activatingCallsign;
    return `${when} · ${who}`;
  }

  function formatAlertsBrief(alerts, cap = 3){
    if (!alerts.length) return null;
    return alerts.slice(0, cap).map(formatAlertBrief).join('; ') + (alerts.length > cap ? ` +${alerts.length - cap} more` : '');
  }

  // Search-result/pinned-summit cards aren't built from the date-filtered
  // alert set already computed inside renderAll() (they're independent,
  // on-demand lookups), so re-derive it the same way, directly from the
  // date inputs currently on screen.
  function alertsForSummitInRange(key){
    const from = document.getElementById('range-from').value;
    const to = document.getElementById('range-to').value;
    return filterAlertsByRange(state.rawAlerts, from, to).filter(a => `${a.associationCode}/${a.summitCode}` === key);
  }

  /* ---------- band/mode parsing ----------
     SOTA's `frequency` field is free text typed by the alerting operator,
     not a structured format — real samples range from clean
     ("145-fm, 14-ssb, 7-ssb") to genuinely messy ("7-14-28 SSB 144.200 SSB
     144 FM", "146,52-FM" with a European comma-as-decimal-point, bare "Hf,
     cw, vhf"). There's no parser that gets 100% of this right; the
     approach below is deliberately "best effort, never silently hide an
     alert" rather than "strict, might misfile or drop odd entries":
     mode keywords are found anywhere in the string (robust to missing
     separators like "146.520FM"), and bands come from three independent
     signals (explicit "20m"/"70cm" names, bare "HF"/"VHF"/"UHF", and any
     number treated as a literal MHz frequency looked up against standard
     band edges) — an alert with nothing recognizable at all still gets
     bucketed under "other" so it stays visible rather than disappearing
     under a band/mode filter. */

  const HAM_BANDS = [
    { name: '2200m', min: 0.1357, max: 0.1378 },
    { name: '630m', min: 0.472, max: 0.479 },
    { name: '160m', min: 1.8, max: 2.0 },
    { name: '80m', min: 3.5, max: 4.0 },
    { name: '60m', min: 5.06, max: 5.45 },
    { name: '40m', min: 7.0, max: 7.3 },
    { name: '30m', min: 10.1, max: 10.15 },
    { name: '20m', min: 14.0, max: 14.35 },
    { name: '17m', min: 18.068, max: 18.168 },
    { name: '15m', min: 21.0, max: 21.45 },
    { name: '12m', min: 24.89, max: 24.99 },
    { name: '10m', min: 28.0, max: 29.7 },
    { name: '6m', min: 50, max: 54 },
    { name: '4m', min: 70, max: 71 },
    { name: '2m', min: 144, max: 148 },
    { name: '1.25m', min: 222, max: 225 },
    { name: '70cm', min: 420, max: 450 },
    { name: '33cm', min: 902, max: 928 },
    { name: '23cm', min: 1240, max: 1300 },
    { name: '13cm', min: 2300, max: 2450 },
  ];
  // Display/sort order for the facet checkboxes: low frequency to high,
  // then the generic HF/VHF/UHF buckets, then "other" last.
  const BAND_SORT_ORDER = [...HAM_BANDS.map(b => b.name), 'HF', 'VHF', 'UHF', 'other'];
  const MODE_KEYWORDS = ['CW', 'SSB', 'FM', 'AM', 'DV', 'DMR', 'DSTAR', 'C4FM', 'DATA', 'FT8', 'FT4', 'RTTY', 'PSK'];
  const MODE_SORT_ORDER = [...MODE_KEYWORDS, 'other'];

  function bandForFreqMHz(freq){
    const b = HAM_BANDS.find(b => freq >= b.min && freq <= b.max);
    return b ? b.name : null;
  }

  function parseFrequencyFacets(freqStr){
    const s = freqStr || '';
    const lower = s.toLowerCase();
    const modes = new Set();
    for (const kw of MODE_KEYWORDS){
      // Boundary excludes letters but allows digits, since "146.520FM" (no
      // separator between frequency and mode) is a common real pattern.
      if (new RegExp(`(?:^|[^a-z])${kw.toLowerCase()}(?:[^a-z]|$)`).test(lower)) modes.add(kw);
    }
    const bands = new Set();
    let m;
    const nameRe = /(\d+(?:\.\d+)?)\s*(m|cm)\b/gi;
    while ((m = nameRe.exec(s))) bands.add(`${m[1]}${m[2].toLowerCase()}`);
    if (/\bhf\b/i.test(s)) bands.add('HF');
    if (/\bvhf\b/i.test(s)) bands.add('VHF');
    if (/\buhf\b/i.test(s)) bands.add('UHF');
    // Bare numbers, treated as literal MHz frequencies (comma-as-decimal
    // tolerated) — covers the common "7-cw" / "144.2-ssb" shorthand. Can
    // misfire for ambiguous single/double-digit VHF shorthand (e.g. a bare
    // "2" meaning "2m" gets read as 2 MHz, which lands in 160m instead) —
    // a known, accepted limitation of free-text input, not silently wrong
    // in a way that hides the alert (it still lands in *some* band).
    const numRe = /(\d+(?:[.,]\d+)?)/g;
    while ((m = numRe.exec(s))){
      const freq = parseFloat(m[1].replace(',', '.'));
      if (!isNaN(freq)){
        const band = bandForFreqMHz(freq);
        if (band) bands.add(band);
      }
    }
    return { bands, modes };
  }

  function alertBandsModes(alert){
    const { bands, modes } = parseFrequencyFacets(alert.frequency);
    return {
      bands: bands.size ? bands : new Set(['other']),
      modes: modes.size ? modes : new Set(['other']),
    };
  }

  function matchesBandModeFilter(alert, selectedBands, selectedModes){
    if (!selectedBands.size && !selectedModes.size) return true;
    const { bands, modes } = alertBandsModes(alert);
    const bandOk = !selectedBands.size || [...bands].some(b => selectedBands.has(b));
    const modeOk = !selectedModes.size || [...modes].some(m => selectedModes.has(m));
    return bandOk && modeOk;
  }

  function sortByOrder(values, order){
    return [...values].sort((a, b) => {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
  }

  // Default "to" date: DEFAULT_RANGE_DAYS after `min`, clamped so it never
  // exceeds the data's actual max (which would otherwise widen the default
  // window on a quiet week with few near-term alerts).
  function capDefaultToDate(min, max){
    const d = new Date(min + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + (DEFAULT_RANGE_DAYS - 1));
    const capped = d.toISOString().slice(0, 10);
    return capped < max ? capped : max;
  }

  function groupAlertsBySummit(alerts){
    const groups = new Map();
    for (const a of alerts){
      const key = `${a.associationCode}/${a.summitCode}`;
      if (!groups.has(key)){
        groups.set(key, { key, associationCode: a.associationCode, summitCode: a.summitCode, alerts: [] });
      }
      groups.get(key).alerts.push(a);
    }
    return groups;
  }

  /* ---------- own-callsign matching ---------- */

  function normalizeCallsignBase(cs){
    // Portable/mobile suffixes (P, M, MM, QRP, ...) are short and can appear
    // either after the call ("OE1ABC/P") or, less commonly for activator
    // alerts, as a location prefix before it ("W4/OE1ABC"). Taking the
    // longest slash-separated segment handles both shapes without needing a
    // suffix dictionary; it's a heuristic, not a callsign-format validator.
    const parts = (cs || '').toUpperCase().trim().split('/').filter(Boolean);
    if (parts.length === 0) return '';
    return parts.reduce((a, b) => (b.length > a.length ? b : a));
  }

  function parseOwnCallsigns(text){
    return new Set((text || '').split(',').map(normalizeCallsignBase).filter(Boolean));
  }

  function isOwnAlert(alert, ownSet){
    return ownSet.has(normalizeCallsignBase(alert.activatingCallsign));
  }

  function loadOwnCallsignsRaw(){
    try { return localStorage.getItem(LS_KEY_CALLSIGNS) || ''; }
    catch { return ''; }
  }
  function persistOwnCallsigns(raw){
    try { localStorage.setItem(LS_KEY_CALLSIGNS, raw); }
    catch { addWarning('could not save your callsign(s) locally (storage full or blocked) — you\'ll need to re-enter them next visit.'); }
  }

  /* ---------- pinned candidate summits (searched by name/code, not just alerted ones) ---------- */

  function loadCandidates(){
    try {
      const raw = JSON.parse(localStorage.getItem(LS_KEY_CANDIDATES) || '[]');
      return new Map(raw.map(c => [c.key, c]));
    } catch { return new Map(); }
  }
  function saveCandidates(candidates){
    try { localStorage.setItem(LS_KEY_CANDIDATES, JSON.stringify([...candidates.values()])); }
    catch { addWarning('could not save your pinned summits locally (storage full or blocked).'); }
  }

  async function searchSummits(term, signal){
    const res = await fetch(summitSearchUrl(term), { signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  }

  // Session-only, case-insensitive memoization of search results — retyping/
  // backspacing to a term already searched (common while narrowing a query)
  // shouldn't re-hit the API for the exact same string.
  const summitSearchCache = new Map();
  let summitSearchAbortController = null; // cancels a still-in-flight search when a newer one supersedes it, so a slow response to an earlier keystroke can't overwrite a later one's results

  // The search endpoint returns a combined "ASSOC/CODE" summitCode (unlike
  // the alerts feed, which has associationCode/summitCode as separate
  // fields) — split on the first "/" to recover both.
  function splitSummitKey(key){
    const parts = (key || '').split('/');
    const assoc = parts.shift();
    return { assoc, code: parts.join('/') };
  }

  function candidateFromSearchResult(r){
    return { key: r.summitCode, ...splitSummitKey(r.summitCode), name: r.name, altM: r.altM, points: r.points, lat: r.latitude, lon: r.longitude, locator: r.locator || null };
  }

  // asReference: also select it as the distance/elevation reference point.
  // Setting a reference implies pinning it too — the reference needs its
  // own marker on the map (distance/elevation math needs its coordinates
  // from state.summitMap, and visually a line to nowhere would be
  // confusing), and pinning is what puts an unalerted summit on the map.
  function pinCandidate(cand, { asReference = false } = {}){
    if (cand.lat == null || cand.lon == null) return;
    state.candidates.set(cand.key, cand);
    saveCandidates(state.candidates);
    if (asReference) state.referenceKey = cand.key;
    renderAll();
  }
  function unpinCandidate(key){
    state.candidates.delete(key);
    saveCandidates(state.candidates);
    renderAll();
  }

  /* ---------- shareable link ---------- */

  // Display preferences (theme, tile layer, time format, own callsigns)
  // deliberately aren't included — those are about how *you* like to look
  // at things, not what's being looked at, and a shared link silently
  // overriding a recipient's own settings would be surprising.
  function buildShareUrl(){
    const params = new URLSearchParams();
    const from = document.getElementById('range-from').value;
    const to = document.getElementById('range-to').value;
    if (from) params.set('from', from);
    if (to) params.set('to', to);
    if (state.referenceKey) params.set('ref', state.referenceKey);
    if (state.candidates.size) params.set('pins', [...state.candidates.keys()].join(','));
    if (state.selectedBands.size) params.set('bands', [...state.selectedBands].join(','));
    if (state.selectedModes.size) params.set('modes', [...state.selectedModes].join(','));
    const url = new URL(location.href);
    url.search = params.toString();
    url.hash = '';
    return url.toString();
  }

  // Applies from/ref/pins/bands/modes found in the URL's query string, if
  // any, at startup. Pins are *merged* into whatever's already pinned
  // locally, never replacing it — opening someone else's shared link
  // shouldn't wipe out summits you'd already pinned yourself. Returns
  // whether anything was actually applied, so init() knows to force-frame
  // the view to it (overriding the "restore my last view" default).
  async function applySharedStateFromUrl(){
    const params = new URLSearchParams(location.search);
    if (![...params.keys()].length) return false;

    const from = params.get('from');
    const to = params.get('to');
    if (from) document.getElementById('range-from').value = from;
    if (to) document.getElementById('range-to').value = to;

    if (params.has('bands')){
      state.selectedBands = new Set(params.get('bands').split(',').filter(Boolean));
      saveStringSet(LS_KEY_BANDS, state.selectedBands);
    }
    if (params.has('modes')){
      state.selectedModes = new Set(params.get('modes').split(',').filter(Boolean));
      saveStringSet(LS_KEY_MODES, state.selectedModes);
    }

    const refKey = params.get('ref');
    const pinKeys = new Set((params.get('pins') || '').split(',').filter(Boolean));
    // The reference always needs its own marker to mean anything (distance/
    // elevation math needs its coordinates), so make sure it gets resolved
    // as a pin too, same as clicking "set as reference" in a search result.
    if (refKey) pinKeys.add(refKey);

    // Routed through resolveSummits() (static-lookup-first, live API as
    // fallback, concurrency-capped) rather than a raw per-key fetchSummit()
    // loop — a shared link with many pins shouldn't fire an unbounded
    // Promise.all of live requests any more than loading alerts should.
    const toFetch = [...pinKeys].filter(k => !state.candidates.has(k)).map(key => ({ key, ...splitSummitKey(key) }));
    const resolvedMap = await resolveSummits(toFetch, false);
    let anyMissing = false;
    for (const e of toFetch){
      const summit = resolvedMap.get(e.key);
      if (summit) state.candidates.set(e.key, { key: e.key, assoc: e.assoc, code: e.code, ...summit });
      else anyMissing = true;
    }
    if (toFetch.length) saveCandidates(state.candidates);
    if (anyMissing) addWarning("some summits from the shared link couldn't be found and were skipped.");

    if (refKey && state.candidates.has(refKey)) state.referenceKey = refKey;
    else if (refKey) addWarning(`the shared link's reference summit (${refKey}) couldn't be found.`);

    // Strip the query string once applied — otherwise it'd linger and go
    // stale the moment anything changes locally; "share" always builds a
    // fresh link from current state rather than treating the URL as live.
    history.replaceState(null, '', location.pathname + location.hash);
    return true;
  }

  /* ---------- summit coordinate lookup (static-first, live API as fallback, cached in localStorage) ---------- */

  let summitLookupData = null;    // Map<key, record> built from SUMMIT_LOOKUP_URL, lazy-loaded once on first use
  let summitLookupLoading = null; // in-flight load promise, so concurrent resolveSummits() calls can't trigger duplicate fetches

  // Same same-origin/lazy/memoized pattern as loadAllSummitsData() below, but
  // for the small keyed lookup rather than the full overlay dataset.
  async function loadSummitLookupData(){
    if (summitLookupData) return summitLookupData;
    if (summitLookupLoading) return summitLookupLoading;
    summitLookupLoading = (async () => {
      const res = await fetch(SUMMIT_LOOKUP_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = await res.json();
      const map = new Map();
      for (const [key, lat, lon, name, altM, points, bonusPoints] of rows){
        const rec = { name, lat, lon, locator: null };
        if (altM != null) rec.altM = altM;
        if (points != null) rec.points = points;
        if (bonusPoints != null) rec.bonusPoints = bonusPoints;
        map.set(key, rec);
      }
      return map;
    })();
    try {
      summitLookupData = await summitLookupLoading;
    } catch (err) {
      console.error('summit lookup data failed to load, falling back to the live API for every summit:', err);
      summitLookupData = new Map(); // empty, not null — don't retry the failing fetch on every resolveSummits() call
    } finally {
      summitLookupLoading = null;
    }
    return summitLookupData;
  }

  function loadSummitCache(){
    try { return JSON.parse(localStorage.getItem(LS_KEY_SUMMIT_CACHE) || '{}'); }
    catch { return {}; }
  }
  function saveSummitCache(cache){
    try { localStorage.setItem(LS_KEY_SUMMIT_CACHE, JSON.stringify(cache)); }
    catch { addWarning('summit coordinate cache could not be saved locally (storage full or blocked); it will be re-fetched every visit.'); }
  }

  async function fetchSummit(assoc, code){
    const res = await fetch(summitUrl(assoc, code));
    if (!res.ok) return null;
    const data = await res.json();
    if (data.latitude == null || data.longitude == null) return null;
    return {
      name: data.name || `${assoc}/${code}`,
      altM: data.altM,
      points: data.points,
      lat: data.latitude,
      lon: data.longitude,
      locator: data.locator || null,
      fetchedAt: Date.now(),
    };
  }

  // Resolves {key, assoc, code} entries to summit records: localStorage
  // cache first (TTL-based), then the static build-time lookup (free —
  // same-origin, already loaded), and only what's missing from *both* goes
  // to the live per-summit API, through a small concurrency pool so a busy
  // day doesn't fire 100+ requests at once. `force` (the "refresh summits"
  // button) skips straight to the live API for every entry, same as before
  // — it exists precisely to get authoritative fresh data, not whatever the
  // last weekly build happened to have. Returns a Map<key, summitRecord>
  // (entries with no coordinates or a failed lookup are simply absent —
  // never guessed at).
  async function resolveSummits(entries, force){
    const cache = loadSummitCache();
    const now = Date.now();
    const result = new Map();
    const toFetch = [];
    for (const e of entries){
      const cached = cache[e.key];
      if (!force && cached && (now - cached.fetchedAt) < SUMMIT_CACHE_TTL_MS){
        result.set(e.key, cached);
      } else {
        toFetch.push(e);
      }
    }

    let cacheChanged = false;
    let stillMissing = toFetch;
    if (!force && toFetch.length){
      const lookup = await loadSummitLookupData();
      stillMissing = [];
      for (const e of toFetch){
        const found = lookup.get(e.key);
        if (found){
          const record = { ...found, fetchedAt: now };
          result.set(e.key, record);
          cache[e.key] = record;
          cacheChanged = true;
        } else {
          stillMissing.push(e);
        }
      }
    }

    let idx = 0;
    async function worker(){
      while (idx < stillMissing.length){
        const e = stillMissing[idx++];
        try {
          const summit = await fetchSummit(e.assoc, e.code);
          if (summit){
            result.set(e.key, summit);
            cache[e.key] = summit;
            cacheChanged = true;
          }
        } catch (err) {
          console.error(`summit lookup failed for ${e.key}:`, err);
        }
      }
    }
    const workers = Array.from({ length: Math.min(FETCH_POOL_SIZE, stillMissing.length) }, worker);
    await Promise.all(workers);
    if (cacheChanged) saveSummitCache(cache);
    return result;
  }

  /* ---------- map ---------- */

  let map, markerLayer;
  let distanceLine = null;   // the polyline+label currently shown between the reference and a hovered/opened summit
  let hoveredKey = null;     // summit key currently under the mouse (map marker or list item), if any
  let pinnedPopupKey = null; // summit key whose popup was explicitly clicked open — stays open on mouseout regardless of hover, until closed via the popup's own control or by opening a different one
  let openPopupKey = null;   // summit key whose popup is currently open, if any
  let currentGroups = new Map(); // this render's summit key -> {alerts, ...}, used by the pinned-summits list to show "alert: ..." without a separate lookup
  let popupCloseTimer = null; // debounce for hover-close, so moving from a marker into its own popup content doesn't slam it shut first
  let summitSearchDebounceTimer = null; // debounce for auto-search-as-you-type in the "pin a summit" box
  let allSummitsData = null;    // the full ~172k-summit dataset (oe1ebg/scripts/fetch_summits.py's output), lazy-loaded once on first use
  let allSummitsLoading = null; // in-flight load promise, so rapid toggling can't trigger duplicate fetches
  let allSummitsEnabled = false;
  let allSummitsLayer = null;
  let allSummitsRenderer = null; // a single shared canvas renderer — hundreds of individual SVG nodes (Leaflet's default) visibly lag; canvas doesn't

  function cssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // Draws (or removes) the reference→other distance line. Hover takes
  // priority over an open popup so mousing over a different summit while
  // another's popup is open previews that one instead; moving away falls
  // back to the open popup's line, if any. Distance/elevation/activator
  // details live in the summit's own popup (which now opens on hover too,
  // see renderMarkers()) rather than a separate floating label — showing
  // the same info in two overlapping boxes at once was redundant once the
  // popup itself became hover-visible.
  function updateDistanceLine(){
    if (distanceLine){ map.removeLayer(distanceLine); distanceLine = null; }
    const otherKey = hoveredKey || openPopupKey;
    if (!state.referenceKey || !otherKey || otherKey === state.referenceKey) return;
    const ref = state.summitMap.get(state.referenceKey);
    const other = state.summitMap.get(otherKey);
    if (!ref || !other) return;
    const latlngs = [[ref.lat, ref.lon], [other.lat, other.lon]];
    // A single --warn line (matching the reference marker) blends into
    // OpenTopoMap's browns/greens/contours. Use a dedicated --route color
    // instead, plus a wider white "halo" line underneath (the standard
    // GPS-track trick) so it stays legible over any basemap, not just
    // whichever one happened to have enough contrast.
    const halo = L.polyline(latlngs, { color: '#fff', weight: 6, opacity: 0.85, interactive: false });
    const line = L.polyline(latlngs, { color: cssVar('--route'), weight: 3, dashArray: '6 4', interactive: false });
    distanceLine = L.layerGroup([halo, line]).addTo(map);
  }

  // Hover-to-open popups need a debounced close: mousing from the marker
  // icon onto the popup box itself (to click a link/button in it) fires
  // the marker's mouseout immediately, which would otherwise slam the
  // popup shut before the click can land.
  function scheduleClosePopup(marker){
    clearTimeout(popupCloseTimer);
    popupCloseTimer = setTimeout(() => marker.closePopup(), 200);
  }
  function cancelClosePopup(){
    clearTimeout(popupCloseTimer);
  }

  const SOTA_CREDIT = 'alert &amp; summit data via SOTA (unofficial)';

  const LS_KEY_BASE_LAYER = 'sota-alerts-base-layer';
  const LS_KEY_MAP_VIEW = 'sota-alerts-map-view';

  // Remembers where you were last looking, across visits — so a returning
  // visitor's manually-chosen view isn't overridden by auto-fitting to
  // whatever alerts happen to exist this time (see init()'s fitView call).
  function loadSavedMapView(){
    try {
      const v = JSON.parse(localStorage.getItem(LS_KEY_MAP_VIEW) || 'null');
      if (v && typeof v.lat === 'number' && typeof v.lng === 'number' && typeof v.zoom === 'number') return v;
    } catch { /* ignore */ }
    return null;
  }
  function saveMapView(){
    try {
      const c = map.getCenter();
      localStorage.setItem(LS_KEY_MAP_VIEW, JSON.stringify({ lat: c.lat, lng: c.lng, zoom: map.getZoom() }));
    } catch { /* ignore */ }
  }

  // sotl.as's router (verified against its own source, manuelkasper/
  // sotlas-frontend) has a dedicated route for this exact purpose:
  // /map/coordinates/{lat},{lon}/{zoom} — "lat,lon" order (it reverses
  // this internally for Mapbox GL's [lng,lat] convention), zoom as a plain
  // number. Confirmed live (200, serves the SPA shell at that route).
  function sotlasUrlForCurrentView(){
    const c = map.getCenter();
    const zoom = Math.round(map.getZoom() * 10) / 10;
    return `https://sotl.as/map/coordinates/${c.lat.toFixed(5)},${c.lng.toFixed(5)}/${zoom}`;
  }

  function initMap(){
    const savedView = loadSavedMapView();
    map = L.map('map', { worldCopyJump: true })
      .setView(savedView ? [savedView.lat, savedView.lng] : [47, 10], savedView ? savedView.zoom : 4);
    map.on('moveend', saveMapView);

    // OpenTopoMap is the default: a community OSM+SRTM-derived render with
    // contour lines and trails, much more useful for summit/hiking context
    // than plain OSM streets-and-buildings tiles (sotl.as itself uses a
    // similar "outdoor" style, via a keyed commercial vector provider —
    // OpenTopoMap gets a comparable look from free, key-less raster tiles).
    const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      subdomains: 'abc',
      attribution: 'Map: &copy; <a href="https://opentopomap.org/copyright" target="_blank" rel="noopener">OpenTopoMap</a> (CC-BY-SA) · ' + SOTA_CREDIT,
    });
    const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · ' + SOTA_CREDIT,
    });
    // basemap.at: Austria's official survey basemap (BEV/geoland), free,
    // key-less, CORS-open — but Austria-only, so it's an alternate choice
    // rather than the global default. Its tile path order is z/y/x (not
    // the usual z/x/y), hence the swapped placeholders below.
    // Host + URL confirmed against the service's own live WMTS
    // GetCapabilities document (mapsneu.wien.gv.at/basemapneu/1.0.0/
    // WMTSCapabilities.xml), which declares this exact template with no
    // subdomain scheme — the "maps1"–"maps4" load-balancing subdomains
    // from older third-party examples no longer even resolve (verified via
    // DNS lookup: NXDOMAIN), which was silently failing ~4 out of every 5
    // tile requests before this fix. `bounds` keeps Leaflet from even
    // trying to fetch tiles outside Austria's rough extent, since alerts
    // are shown worldwide but this layer only covers one country.
    const basemapAt = L.tileLayer('https://mapsneu.wien.gv.at/basemap/geolandbasemap/normal/google3857/{z}/{y}/{x}.png', {
      maxZoom: 19,
      bounds: L.latLngBounds([46.3, 9.4], [49.1, 17.3]),
      attribution: 'Grundkarte: <a href="https://basemap.at/" target="_blank" rel="noopener">basemap.at</a> · ' + SOTA_CREDIT,
    });

    const baseLayers = { 'Outdoor (OpenTopoMap)': topo, 'Streets (OpenStreetMap)': streets, 'Austria (basemap.at)': basemapAt };
    let savedLayerName = null;
    try { savedLayerName = localStorage.getItem(LS_KEY_BASE_LAYER); } catch { /* ignore */ }
    (baseLayers[savedLayerName] || topo).addTo(map);
    L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);
    map.on('baselayerchange', e => {
      try { localStorage.setItem(LS_KEY_BASE_LAYER, e.name); } catch { /* ignore */ }
    });

    markerLayer = L.layerGroup().addTo(map);

    // A single shared canvas renderer for the "all summits" overlay —
    // Leaflet's default per-marker SVG rendering visibly lags once you're
    // placing hundreds of circle markers; routing them through one canvas
    // element instead keeps it smooth.
    allSummitsRenderer = L.canvas();
    allSummitsLayer = L.layerGroup();
    map.on('moveend', () => { if (allSummitsEnabled) renderAllSummitsOverlay(); });

    map.on('popupopen', (e) => {
      const el = e.popup.getElement();
      if (!el) return;
      const setBtn = el.querySelector('[data-set-ref]');
      if (setBtn) setBtn.addEventListener('click', () => { state.referenceKey = setBtn.dataset.setRef; renderAll(); });
      const clearBtn = el.querySelector('[data-clear-ref]');
      if (clearBtn) clearBtn.addEventListener('click', () => { state.referenceKey = null; renderAll(); });
      const pinBtn = el.querySelector('[data-pin-candidate]');
      if (pinBtn) pinBtn.addEventListener('click', () => {
        const key = pinBtn.dataset.pinCandidate;
        const summit = state.summitMap.get(key);
        if (summit) pinCandidate({ key, ...splitSummitKey(key), ...summit });
      });
      const removeBtn = el.querySelector('[data-remove-candidate]');
      if (removeBtn) removeBtn.addEventListener('click', () => unpinCandidate(removeBtn.dataset.removeCandidate));
    });
  }

  function markerIcon(isOwn, isRef, isCandidate){
    const cls = ['sota-pin', isOwn ? 'own' : 'default', isRef ? 'reference' : '', isCandidate ? 'candidate' : ''].filter(Boolean).join(' ');
    // Reference and candidate pins are drawn larger than a plain default
    // one (see the CSS .sota-pin.reference/.candidate rules; reference
    // wins if a summit is both) — iconSize/iconAnchor/popupAnchor must
    // match whichever size actually applies or Leaflet's positioning math
    // (which anchor point sits on the real lat/lon) will be based on the
    // wrong box and the pin will look slightly offset from where it's
    // actually pointing.
    const [w, h] = isRef ? [32, 42] : isCandidate ? [28, 37] : [26, 34];
    return L.divIcon({
      className: '',
      html: `<div class="${cls}">${PIN_SVG}</div>`,
      iconSize: [w, h],
      iconAnchor: [w / 2, h],
      popupAnchor: [0, -Math.round(h * 30 / 34)],
    });
  }

  // Shared "480m · 8 pts · JN67dn" summary line, used by the marker popup,
  // the pinned-summits list, and search-result cards. `locator` (Maidenhead
  // grid) comes straight from the SOTA API but was previously fetched and
  // discarded — hams commonly want it alongside lat/lon.
  function summitMetaLine(s){
    let ptsPart = null;
    if (s.points != null){
      ptsPart = `${s.points} pts`;
      // Real per-summit data (a fixed bonus tied to certain summits, not
      // derivable from the points tier alone — checked live, it shows up
      // across every points tier, not just one), only ever present on
      // entries sourced from the "all summits" bulk data, since the
      // per-summit/search API endpoints used elsewhere don't expose it.
      if (s.bonusPoints) ptsPart += ` (+${s.bonusPoints} bonus)`;
    }
    return [s.altM ? `${s.altM}m` : null, ptsPart, s.locator || null]
      .filter(Boolean).join(' · ');
  }

  // Great-circle distance in km between two lat/lon points (haversine).
  function haversineKm(lat1, lon1, lat2, lon2){
    const R = 6371;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // Distance + elevation delta of `summit` relative to the currently-selected
  // reference summit, or null if no reference is set / it isn't resolved.
  function referenceDiff(summit, referenceKey, summitMap){
    if (!referenceKey) return null;
    const ref = summitMap.get(referenceKey);
    if (!ref) return null;
    const distKm = haversineKm(summit.lat, summit.lon, ref.lat, ref.lon);
    const heightDiffM = (summit.altM != null && ref.altM != null) ? (summit.altM - ref.altM) : null;
    return { distKm, heightDiffM, refName: ref.name };
  }

  function referenceDiffHtml(diff){
    if (!diff) return '';
    const height = diff.heightDiffM != null ? `, ${diff.heightDiffM > 0 ? '+' : ''}${diff.heightDiffM} m` : '';
    return `<div class="ref-diff">${diff.distKm.toFixed(1)} km${height} from reference (${escapeHtml(diff.refName)})</div>`;
  }

  function buildPopupHtml(group, summit, ownSet, referenceKey, summitMap, isCandidate){
    const rows = group.alerts.slice()
      .sort((a, b) => a.dateActivated.localeCompare(b.dateActivated))
      .map(a => {
        const own = isOwnAlert(a, ownSet);
        const { primary, secondary } = timeDisplayPair(a.dateActivated, false);
        return `<div class="alert-row${own ? ' own' : ''}">` +
          `<b>${escapeHtml(a.activatingCallsign)}</b> — ${escapeHtml(primary)}${secondary ? ` (${escapeHtml(secondary)})` : ''}<br>` +
          `<span class="freq">${escapeHtml(a.frequency)}</span>` +
          (a.comments ? `<div class="comment">${escapeHtml(a.comments)}</div>` : '') +
          `</div>`;
      }).join('');
    const altPts = summitMetaLine(summit);
    const isRef = group.key === referenceKey;
    const refBtn = isRef
      ? `<button type="button" class="btn-ref" data-clear-ref>clear reference</button>`
      : `<button type="button" class="btn-ref" data-set-ref="${escapeHtml(group.key)}">set as reference</button>`;
    const pinBtn = isCandidate
      ? `<button type="button" class="btn-ref danger" data-remove-candidate="${escapeHtml(group.key)}">remove pin</button>`
      : `<button type="button" class="btn-ref" data-pin-candidate="${escapeHtml(group.key)}">pin this summit</button>`;
    return `<div class="sota-popup">` +
      `<div class="popup-title">${escapeHtml(summit.name)} <span class="code">${escapeHtml(group.key)}</span></div>` +
      `<div class="popup-meta">${altPts ? altPts + ' · ' : ''}` +
      // Path segments must be encoded individually and rejoined with a
      // literal "/" — encoding the combined "ASSOC/CODE" key turns the
      // separator into "%2F", which both sites' routers don't treat as a
      // path boundary (e.g. sotadata.org.uk/en/summit/OE%2FTI-521 doesn't resolve).
      `<a href="https://www.sotadata.org.uk/en/summit/${encodeURIComponent(group.associationCode)}/${encodeURIComponent(group.summitCode)}" target="_blank" rel="noopener">sotadata ↗</a> · ` +
      `<a href="https://sotl.as/summits/${encodeURIComponent(group.associationCode)}/${encodeURIComponent(group.summitCode)}" target="_blank" rel="noopener">sotl.as ↗</a>` +
      `</div>` +
      // Popups now open on hover (see renderMarkers()), so this is the
      // one place distance/elevation-vs-reference needs to live — the
      // connecting line (updateDistanceLine()) is purely the visual/
      // spatial aid now, not a second copy of this same text.
      referenceDiffHtml(referenceDiff(summit, isRef ? null : referenceKey, summitMap)) +
      `<div class="popup-ref">${refBtn} ${pinBtn}</div>` +
      (rows || '<div class="popup-empty">no alerts in the current date range</div>') +
      `</div>`;
  }

  function renderMarkers(groups, summitMap, ownSet, referenceKey, candidates, fitView){
    currentGroups = groups;
    if (distanceLine){ map.removeLayer(distanceLine); distanceLine = null; }
    hoveredKey = null;
    openPopupKey = null;
    pinnedPopupKey = null;
    markerLayer.clearLayers();
    const bounds = [];
    for (const group of groups.values()){
      const summit = summitMap.get(group.key);
      if (!summit) continue;
      const isOwn = group.alerts.some(a => isOwnAlert(a, ownSet));
      const isCandidate = candidates.has(group.key);
      // autoPan:false — Leaflet's default popup behavior pans the map to
      // keep it in view when opened, which is fine for a deliberate click
      // but would otherwise yank the view around as you casually hover
      // markers near the edge of the screen (opening on hover is new,
      // see below).
      const marker = L.marker([summit.lat, summit.lon], { icon: markerIcon(isOwn, group.key === referenceKey, isCandidate) })
        .bindPopup(buildPopupHtml(group, summit, ownSet, referenceKey, summitMap, isCandidate), { autoPan: false })
        .addTo(markerLayer);
      // Hovering shows the full info card, not just a click — opens on
      // mouseover, closes (debounced) on mouseout so moving the cursor
      // from the marker into the popup itself to click a link/button
      // doesn't slam it shut first (see scheduleClosePopup()). A click
      // *pins* it open regardless of hover (pinnedPopupKey) — closing then
      // only happens via the popup's own close button, clicking elsewhere
      // on the map, or clicking a different marker (Leaflet's default
      // one-popup-at-a-time behavior), never just from the mouse leaving.
      // The hover/pin also previews the distance/elevation line to the
      // reference, if one is set (see updateDistanceLine()).
      marker.on('click', () => {
        pinnedPopupKey = group.key;
        marker.openPopup();
      });
      marker.on('mouseover', () => {
        hoveredKey = group.key;
        cancelClosePopup();
        marker.openPopup();
        updateDistanceLine();
      });
      marker.on('mouseout', () => {
        if (hoveredKey === group.key) hoveredKey = null;
        if (pinnedPopupKey !== group.key) scheduleClosePopup(marker);
        updateDistanceLine();
      });
      marker.on('popupopen', (e) => {
        openPopupKey = group.key;
        updateDistanceLine();
        const el = e.popup.getElement();
        if (el){
          el.addEventListener('mouseenter', cancelClosePopup);
          el.addEventListener('mouseleave', () => { if (pinnedPopupKey !== group.key) scheduleClosePopup(marker); });
        }
      });
      marker.on('popupclose', () => {
        if (openPopupKey === group.key) openPopupKey = null;
        if (pinnedPopupKey === group.key) pinnedPopupKey = null;
        updateDistanceLine();
      });
      bounds.push([summit.lat, summit.lon]);
    }
    // Only re-frame the view on triggers that actually changed *what
    // should be in view* (initial load, alerts refresh, date range
    // change) — not on every render, or incidental UI actions (setting a
    // reference, toggling a band/mode filter, pinning a candidate) would
    // keep yanking the zoom/pan around.
    if (!fitView) return;
    if (bounds.length){
      map.fitBounds(bounds, { padding: [30, 30], maxZoom: 11 });
    } else if (state.userLocation){
      // Nothing to fit bounds to (e.g. an empty date range, or candidates-
      // only with none pinned yet) — fall back to the visitor's own
      // location rather than leaving the map wherever it happened to be.
      map.setView([state.userLocation.lat, state.userLocation.lon], USER_LOCATION_ZOOM);
    }
  }

  /* ---------- "all summits" overlay ----------
     Built at site build time (oe1ebg/scripts/fetch_summits.py downloads and
     trims SOTA's full summit database — storage.sota.org.uk doesn't allow
     browser fetches at all, see the README), shipped as a same-origin
     static asset. Loading it hits our own site, never SOTA's API, and it's
     loaded at most once per session (lazily, only if this is ever turned
     on) — this is the whole point: browsing every summit shouldn't cost
     SOTA anything beyond the one build-time download. */

  const ALL_SUMMITS_URL = 'data/summits.json';
  const ALL_SUMMITS_MIN_ZOOM = 9; // below this, a viewport can contain tens of thousands of summits — ask to zoom in rather than choke the renderer
  const ALL_SUMMITS_MAX_MARKERS = 800;

  async function loadAllSummitsData(){
    if (allSummitsData) return allSummitsData;
    if (allSummitsLoading) return allSummitsLoading;
    allSummitsLoading = (async () => {
      const res = await fetch(ALL_SUMMITS_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })();
    try {
      allSummitsData = await allSummitsLoading;
      return allSummitsData;
    } finally {
      allSummitsLoading = null;
    }
  }

  function buildAllSummitPopupHtml(entry){
    const pinned = state.candidates.has(entry.key);
    const isRef = entry.key === state.referenceKey;
    const meta = summitMetaLine(entry);
    const { assoc, code } = splitSummitKey(entry.key);
    const refBtn = isRef
      ? `<button type="button" class="btn-ref" data-allsummit-clearref>clear reference</button>`
      : `<button type="button" class="btn-ref" data-allsummit-setref>set as reference</button>`;
    const pinBtn = pinned
      ? `<button type="button" class="btn-ref danger" data-allsummit-unpin>remove pin</button>`
      : `<button type="button" class="btn-ref" data-allsummit-pin>pin this summit</button>`;
    return `<div class="sota-popup">` +
      `<div class="popup-title">${escapeHtml(entry.name)} <span class="code">${escapeHtml(entry.key)}</span></div>` +
      `<div class="popup-meta">${meta ? escapeHtml(meta) + ' · ' : ''}` +
      // Same "encode each segment, join with a literal /" as the main popup
      // builder — encoding the combined key turns the separator into
      // "%2F", which neither site's router treats as a path boundary.
      `<a href="https://www.sotadata.org.uk/en/summit/${encodeURIComponent(assoc)}/${encodeURIComponent(code)}" target="_blank" rel="noopener">sotadata ↗</a> · ` +
      `<a href="https://sotl.as/summits/${encodeURIComponent(assoc)}/${encodeURIComponent(code)}" target="_blank" rel="noopener">sotl.as ↗</a>` +
      `</div>` +
      `<div class="popup-ref">${refBtn} ${pinBtn}</div>` +
      `</div>`;
  }

  // Matches sotl.as's own summit-dot coloring exactly (its "summits_circles_all"
  // map layer, found in its style JSON — e.g. src/assets/basemapat.json in
  // manuelkasper/sotlas-frontend): color by SOTA points value rather than a
  // single flat color, white stroke, semi-transparent. SOTA's points tiers
  // are always one of these six; the fallback only matters for odd data.
  function sotlasPointsColor(points){
    switch (points){
      case 1: return '#4d7a20';
      case 2: return '#6da536';
      case 4: return '#aea727';
      case 6: return '#efa818';
      case 8: return '#dc5d04';
      case 10: return '#c8101e';
      default: return '#000';
    }
  }

  function renderAllSummitsOverlay(){
    if (!allSummitsLayer) return;
    allSummitsLayer.clearLayers();
    document.getElementById('all-summits-note').textContent = '';
    if (!allSummitsEnabled || !allSummitsData) return;
    if (map.getZoom() < ALL_SUMMITS_MIN_ZOOM){
      document.getElementById('all-summits-note').textContent = 'zoom in further to show all summits here';
      return;
    }
    const bounds = map.getBounds();
    // Skip anything already shown as a "real" pin (alerted, pinned, or the
    // reference) — those already have their own, more prominent marker;
    // showing a second dim dot underneath would just be visual clutter.
    const inView = allSummitsData.filter(s =>
      bounds.contains([s.lat, s.lon]) && !state.summitMap.has(s.key));
    if (inView.length > ALL_SUMMITS_MAX_MARKERS){
      document.getElementById('all-summits-note').textContent =
        `${inView.length} summits in view — zoom in further to show them`;
      return;
    }
    for (const entry of inView){
      const marker = L.circleMarker([entry.lat, entry.lon], {
        renderer: allSummitsRenderer,
        radius: 9,
        weight: 2,
        color: '#fff',
        fillColor: sotlasPointsColor(entry.points),
        fillOpacity: 0.8,
      }).bindPopup(() => buildAllSummitPopupHtml(entry)); // a function, not a string: re-evaluated on each open so pin/reference state stays current
      marker.on('popupopen', (e) => {
        const el = e.popup.getElement();
        if (!el) return;
        const setBtn = el.querySelector('[data-allsummit-setref]');
        if (setBtn) setBtn.addEventListener('click', () => {
          pinCandidate({ ...entry, ...splitSummitKey(entry.key) }, { asReference: true });
          marker.closePopup();
        });
        const clearBtn = el.querySelector('[data-allsummit-clearref]');
        if (clearBtn) clearBtn.addEventListener('click', () => { state.referenceKey = null; renderAll(); marker.closePopup(); });
        const pinBtn = el.querySelector('[data-allsummit-pin]');
        if (pinBtn) pinBtn.addEventListener('click', () => {
          pinCandidate({ ...entry, ...splitSummitKey(entry.key) });
          marker.closePopup();
        });
        const unpinBtn = el.querySelector('[data-allsummit-unpin]');
        if (unpinBtn) unpinBtn.addEventListener('click', () => { unpinCandidate(entry.key); marker.closePopup(); });
      });
      marker.addTo(allSummitsLayer);
    }
  }

  /* ---------- list panel ---------- */

  function distanceToRefForAlert(a, refSummit, summitMap){
    const summit = summitMap.get(`${a.associationCode}/${a.summitCode}`);
    if (!summit) return null;
    return haversineKm(summit.lat, summit.lon, refSummit.lat, refSummit.lon);
  }

  function renderAlertList(alerts, ownSet, summitMap, referenceKey){
    const el = document.getElementById('list-items');
    if (!alerts.length){
      el.innerHTML = '<div class="list-empty">no alerts in range</div>';
      return;
    }
    // Own alerts always come first regardless of sort mode; within each
    // group, sort by distance to the reference (closest first) once one
    // is set — that's the actual question this tool exists to answer —
    // falling back to chronological order otherwise or where a summit's
    // own coordinates aren't resolvable.
    const refSummit = referenceKey ? summitMap.get(referenceKey) : null;
    const sorted = alerts.slice().sort((a, b) => {
      const aOwn = isOwnAlert(a, ownSet), bOwn = isOwnAlert(b, ownSet);
      if (aOwn !== bOwn) return aOwn ? -1 : 1;
      if (refSummit){
        const da = distanceToRefForAlert(a, refSummit, summitMap);
        const db = distanceToRefForAlert(b, refSummit, summitMap);
        if (da != null && db != null && da !== db) return da - db;
      }
      return a.dateActivated.localeCompare(b.dateActivated);
    });
    const sortNote = refSummit
      ? `<div class="list-section-title">sorted by distance to ${escapeHtml(refSummit.name)}</div>`
      : '';
    el.innerHTML = sortNote + sorted.map(a => {
      const own = isOwnAlert(a, ownSet);
      const key = `${a.associationCode}/${a.summitCode}`;
      const isRef = key === referenceKey;
      const when = timeDisplayPair(a.dateActivated, true).primary;
      const summit = summitMap.get(key);
      const diff = summit ? referenceDiff(summit, isRef ? null : referenceKey, summitMap) : null;
      return `<div class="list-item${own ? ' own' : ''}${isRef ? ' is-ref' : ''}" data-summit-key="${escapeHtml(key)}" title="click to set/clear as reference summit">` +
        `<div class="li-top"><b>${escapeHtml(a.activatingCallsign)}</b><span class="li-summit">${isRef ? '★ ' : ''}${escapeHtml(key)}</span></div>` +
        `<div class="li-meta">${when} · ${escapeHtml(a.frequency)}</div>` +
        referenceDiffHtml(diff) +
        `</div>`;
    }).join('');
    // Hovering a list row previews the same reference distance/elevation
    // line as hovering its marker on the map would. Attached per-item
    // (rather than delegated) since mouseenter/mouseleave don't bubble;
    // cheap given the list is fully rebuilt on every render anyway.
    el.querySelectorAll('.list-item').forEach(item => {
      const key = item.dataset.summitKey;
      item.addEventListener('mouseenter', () => { hoveredKey = key; updateDistanceLine(); });
      item.addEventListener('mouseleave', () => { if (hoveredKey === key) hoveredKey = null; updateDistanceLine(); });
    });
  }

  // Pinned candidate summits (from the search box), shown regardless of
  // whether they currently have an alert — this is what makes "is this a
  // good summit to activate?" answerable even with no alerts of your own.
  function renderCandidatesList(candidates, summitMap, referenceKey){
    const el = document.getElementById('candidates-items');
    if (!candidates.size){ el.innerHTML = ''; return; }
    el.innerHTML = '<div class="list-section-title">pinned summits</div>' + [...candidates.values()].map(c => {
      const isRef = c.key === referenceKey;
      const diff = referenceDiff(c, isRef ? null : referenceKey, summitMap);
      const altPts = summitMetaLine(c);
      // Same alert set the map/popup would show for this summit right now
      // (currentGroups is band/mode-filtered, unlike alertsForSummitInRange).
      const alertBrief = formatAlertsBrief((currentGroups.get(c.key) || {}).alerts || []);
      return `<div class="list-item candidate${isRef ? ' is-ref' : ''}" data-summit-key="${escapeHtml(c.key)}" title="click to set/clear as reference summit">` +
        `<div class="li-top"><b>${escapeHtml(c.name)}</b><span class="li-summit">${isRef ? '★ ' : ''}${escapeHtml(c.key)}</span></div>` +
        (altPts ? `<div class="li-meta">${altPts}</div>` : '') +
        (alertBrief ? `<div class="search-result-alert">alert: ${escapeHtml(alertBrief)}</div>` : '') +
        referenceDiffHtml(diff) +
        `<button type="button" class="btn-ref danger" data-remove-candidate="${escapeHtml(c.key)}">remove pin</button>` +
        `</div>`;
    }).join('');
    el.querySelectorAll('.list-item').forEach(item => {
      const key = item.dataset.summitKey;
      item.addEventListener('mouseenter', () => { hoveredKey = key; updateDistanceLine(); });
      item.addEventListener('mouseleave', () => { if (hoveredKey === key) hoveredKey = null; updateDistanceLine(); });
    });
    el.querySelectorAll('[data-remove-candidate]').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); unpinCandidate(btn.dataset.removeCandidate); });
    });
  }

  /* ---------- band/mode facet panel ---------- */

  function renderFacetGroup(containerId, presentValues, sortOrder, selectedSet){
    const el = document.getElementById(containerId);
    const ordered = sortByOrder(presentValues, sortOrder);
    if (!ordered.length){ el.innerHTML = '<span class="search-hint">none in current range</span>'; return; }
    el.innerHTML = ordered.map(v => {
      const id = `${containerId}-${v.replace(/[^a-zA-Z0-9]/g, '_')}`;
      const checked = selectedSet.has(v) ? 'checked' : '';
      return `<label class="chk" for="${id}"><input type="checkbox" id="${id}" value="${escapeHtml(v)}" ${checked}>${escapeHtml(v)}</label>`;
    }).join('');
  }

  function renderBandModeFacets(alerts){
    const bandsPresent = new Set(), modesPresent = new Set();
    for (const a of alerts){
      const { bands, modes } = alertBandsModes(a);
      bands.forEach(b => bandsPresent.add(b));
      modes.forEach(m => modesPresent.add(m));
    }
    renderFacetGroup('band-checks', bandsPresent, BAND_SORT_ORDER, state.selectedBands);
    renderFacetGroup('mode-checks', modesPresent, MODE_SORT_ORDER, state.selectedModes);
    const active = state.selectedBands.size + state.selectedModes.size;
    document.getElementById('btn-toggle-bandmode').textContent = active ? `bands/modes (${active}) ▾` : 'bands/modes ▾';
  }

  /* ---------- warnings for range / missing summits ---------- */

  function checkRangeWarning(from, to, bounds){
    if (!bounds) return;
    if (from < bounds.min || to > bounds.max){
      addWarning(`SOTA's public alerts feed currently only covers ${bounds.min} – ${bounds.max}; there's no data outside that window (it's a rolling near-term feed, not a historical archive).`);
    }
  }

  function checkMissingSummits(groups, summitMap){
    const missing = [...groups.values()].filter(g => !summitMap.has(g.key));
    if (missing.length){
      addWarning(`${missing.length} alert${missing.length === 1 ? '' : 's'} couldn't be placed on the map (summit lookup failed for: ${missing.map(g => g.key).join(', ')}).`);
    }
  }

  /* ---------- summit search / pin panel ---------- */

  // Shared renderer for the search-results dropdown, fed either by a SOTA
  // name/code search or an OSM area search — both ultimately produce the
  // same {key, assoc, code, name, altM, points, lat, lon} candidate shape.
  function renderPinCandidateResults(cands, emptyMsg){
    const panel = document.getElementById('search-panel');
    panel.classList.add('show');
    if (!cands.length){ panel.innerHTML = `<div class="search-hint">${escapeHtml(emptyMsg)}</div>`; return; }
    panel.innerHTML = cands.slice(0, 30).map(cand => {
